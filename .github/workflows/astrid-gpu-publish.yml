name: Publish private Astrid GPU image

on:
  workflow_dispatch:
    inputs:
      approved_target:
        description: 'Type the approved GHCR package path exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: astrid-gpu-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/jakemanator123-github-work'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jakeminator123/astrid-gpu-worker
      APPROVED_TARGET: ${{ inputs.approved_target }}
    steps:
      - name: Require the exact approved destination
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          test "$IMAGE" = "ghcr.io/$owner/astrid-gpu-worker"
          test "$APPROVED_TARGET" = "$IMAGE"
          echo "Publishing only $IMAGE from $GITHUB_SHA"
      - uses: actions/checkout@v7
        with:
          sparse-checkout: services/astrid-gpu-worker
      - name: Log in to GHCR with repository-scoped token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable commit tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: services/astrid-gpu-worker
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Jakeminator123/github-work
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record digest for private pull and rollback
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          echo "Image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify package visibility is Private before configuring a separate RunPod test endpoint." >> "$GITHUB_STEP_SUMMARY"
