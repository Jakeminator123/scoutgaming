name: Publish private Astrid GPU image

on:
  workflow_dispatch:
    inputs:
      approved_target:
        description: 'Type the approved GHCR package path exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: astrid-gpu-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jakeminator123/astrid-gpu-worker
      APPROVED_TARGET: ${{ inputs.approved_target }}
    steps:
      - name: Require the exact approved destination
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          test "$IMAGE" = "ghcr.io/$owner/astrid-gpu-worker"
          test "$APPROVED_TARGET" = "$IMAGE"
          echo "Publishing only $IMAGE from $GITHUB_SHA"
      - uses: actions/checkout@v7
        with:
          sparse-checkout: services/astrid-gpu-worker
      - name: Log in to GHCR with repository-scoped token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable commit tag for verification
        id: image
        uses: docker/build-push-action@v6
        with:
          context: services/astrid-gpu-worker
          push: false
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Jakeminator123/scoutgaming
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify BGRA channels with the image's actual FFmpeg before publishing
        run: |
          docker run --rm --network none --entrypoint /bin/sh \
            --mount "type=bind,src=$PWD/services/astrid-gpu-worker/tests,dst=/workspace/tests,readonly" \
            "$IMAGE:sha-$GITHUB_SHA" -ec '
              export PATH="/usr/bin:$PATH"
              test "$(command -v ffmpeg)" = /usr/bin/ffmpeg
              test "$(command -v ffprobe)" = /usr/bin/ffprobe
              /usr/bin/ffmpeg -version | head -n 1
              cd /workspace/tests
              /workspace/mt-venv/bin/python -B -m unittest test_streaming.EncoderTests.test_bgra_channels_and_alpha_survive_raw_tcp_input -v
            '
      - name: Publish only the verified image
        id: publish
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          reference=$(docker image inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          test "${reference%@*}" = "$IMAGE"
          digest=${reference#*@}
          printf '%s\n' "$digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record digest for private pull and rollback
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "$DIGEST"
          echo "Image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify package visibility is Private before configuring a separate RunPod test endpoint." >> "$GITHUB_STEP_SUMMARY"
