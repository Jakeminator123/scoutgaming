name: Moving GPU image build check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moving-gpu-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: services/moving-gpu-worker
      - name: Validate the sealed source and isolated contracts
        working-directory: services/moving-gpu-worker
        run: |
          python3 -c 'from contracts import verify_release; print(verify_release("."))'
          python3 -B -m unittest discover -s tests -v
      - name: Build the pinned serverless image on CPU
        # snapshot.ubuntu.com intermittently returns 504s or other bytes; the pinned
        # checksums reject them, so retrying can never admit different content.
        # build.py stays untouched because it is part of the frozen release.
        run: |
          for delay in 0 60 180; do
            sleep "$delay"
            if python3 services/moving-gpu-worker/build.py --target serverless --tag croupier-moving-worker:check; then exit 0; fi
            echo "Docker build failed; retrying after the next delay."
          done
          exit 1
      - name: Verify packaged imports and contracts without GPU or network
        run: |
          docker run --rm --network none --entrypoint /bin/sh croupier-moving-worker:check -ec '
            /workspace/mt-venv/bin/python -B -c "import sys; sys.path.insert(0, \"/opt/moving-worker\"); sys.path.insert(0, \"/opt/moving-worker/vendor\"); import torch, motor, rorlig, serverless, runpod; from contracts import verify_release; print(verify_release(\"/opt/moving-worker\"))"
            /workspace/mt-venv/bin/python -B -m unittest discover -s /opt/moving-worker/tests -v
          '
      - name: Record the build result without publishing or provisioning
        run: |
          echo "Built and import-checked serverless image from $GITHUB_SHA on CPU." >> "$GITHUB_STEP_SUMMARY"
          echo 'No image push, RunPod resource, GPU inference or live-game approval.' >> "$GITHUB_STEP_SUMMARY"
          docker image inspect croupier-moving-worker:check --format '{{.Id}}' >> "$GITHUB_STEP_SUMMARY"
