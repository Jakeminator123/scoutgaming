name: Croupier GitHub checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: croupier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      migration: ${{ steps.scope.outputs.migration }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify CI selection and final gate
        run: node --test test/ci-changes.mjs
      - name: Classify the complete PR merge diff
        id: scope
        run: node tools/ci-changes.mjs

  documentation:
    needs: changes
    if: needs.changes.outputs.scope == 'documentation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Environment registry and documentation contracts
        run: |
          node tools/check-environment-variables.mjs
          node --test test/check-environment-variables.mjs test/github-workflow.mjs test/precommit-checks.mjs test/inbox.mjs test/partner-docs.mjs
          git diff --check HEAD^1 HEAD

  dealer-regression:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            lab/package-lock.json
            apps/croupier-speech/package-lock.json
            web/package-lock.json
            services/astrid-gpu-worker/gateway/package-lock.json
      - name: Install verified ffmpeg packages
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - run: npm --prefix lab ci
      - name: Orphan tests
        run: node tools/check-orphan-tests.mjs
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - name: Restore Studio compiler cache
        uses: actions/cache@v6
        with:
          path: lab/.next/cache
          key: ${{ runner.os }}-studio-next-v1-${{ hashFiles('lab/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-studio-next-v1-${{ hashFiles('lab/package-lock.json') }}-
      - name: Build the real studio used by launcher regression tests
        run: npm --prefix lab run build
      - name: Install the real Next middleware used by frontend regression tests
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false
      - run: pnpm --dir apps/croupier-frontend install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
      - name: Install the speech service's own locked transport
        working-directory: apps/croupier-speech
        run: npm ci --ignore-scripts && npm run build
      - name: Speech transport on its declared Node runtime
        run: node --test --test-concurrency=4 apps/croupier-frontend/test/platform-websocket.mjs test/platform-native-websocket.mjs test/platform-moving-speech.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # OpenClaw launcher acceptance runs in the access suite and needs the build above.
      - run: npm --prefix open-claw/lab run check
      # Same registry as local --full. Each suite has its own visible step;
      # later suites still diagnose failures, and any failed suite fails this job.
      - name: Regression - Studio tests and frontend typecheck
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sh .githooks/pre-commit-full studio
      - name: Regression - Admin and economy journal
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sh .githooks/pre-commit-full admin
      - name: Regression - Contracts, security and ownership
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sh .githooks/pre-commit-full contracts
      - name: Regression - Database, migrations and authority
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sh .githooks/pre-commit-full database
      - name: Regression - Presentation and media identity
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sh .githooks/pre-commit-full presentation
      - name: Regression - Access, wallet, registry and cloud
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sh .githooks/pre-commit-full access
      - name: Regression - Speech and player transport
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sh .githooks/pre-commit-full speech
      - name: Regression - Game rules and media ownership
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sh .githooks/pre-commit-full gameplay
      - name: Existing isolated Studio SQL, restart and HTTPS acceptance
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          # The runner image ships PostgreSQL 16 binaries; the download stays as fallback.
          if [ -x /usr/lib/postgresql/16/bin/initdb ] && [ -x /usr/lib/postgresql/16/bin/pg_ctl ]; then
            postgres_source=(--postgres-bin /usr/lib/postgresql/16/bin)
          else
            postgres_source=(--download-postgres)
          fi
          echo "PostgreSQL source: ${postgres_source[*]}"
          node tools/regression-group.mjs database/isolated-sql-restart-https 360 node tools/studio-isolated-qa.mjs "${postgres_source[@]}"
      - name: Save regression group timings
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dealer-regression-timing-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/dealer-regression-timing.jsonl
      - run: node test/split-rules.mjs
      - run: node --test --test-concurrency=4 test/croupier-chef.mjs test/github-workflow.mjs test/inbox.mjs
      - name: Studio migration readiness (production ledger)
        # Main/manual runs always check the ledger. Client/test-only PR edits
        # need no production access; server/schema/dependency changes still do.
        if: ${{ needs.changes.outputs.migration == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        run: node tools/check-migration-readiness.mjs
        env:
          CROUPIER_GAME_DATABASE_URL: ${{ secrets.CROUPIER_GAME_DATABASE_URL }}

  lipsync-worker:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install verified ffmpeg packages
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway test
      - run: python -m unittest discover -s services/astrid-gpu-worker/tests -v
      - run: python -m compileall -q services/astrid-gpu-worker/workers services/astrid-gpu-worker/handler.py
      - run: bash -n services/astrid-gpu-worker/fetch/fetch-musetalk.sh

  ci:
    name: CI
    needs: [changes, documentation, dealer-regression, lipsync-worker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          // Final gate script
          const jobs = JSON.parse(process.env.CI_NEEDS);
          const scope = jobs.changes?.outputs?.scope;
          const required = scope === 'documentation' ? ['documentation']
            : scope === 'full' ? ['dealer-regression', 'lipsync-worker'] : [];
          if (jobs.changes?.result !== 'success' || required.length === 0
            || required.some(name => jobs[name]?.result !== 'success')) {
            console.error('CI failed: a required check failed, was cancelled, skipped, or was not reported.');
            process.exit(1);
          }
          console.log(`CI passed: ${scope}`);
          NODE
