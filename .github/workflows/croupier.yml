name: Croupier GitHub checks

# What runs when (the scope matrix lives in tools/ci-changes.mjs, SCOPE_LEGS):
#
#   schedule (02:00 UTC, main), workflow_dispatch, push preview
#                                          complete: every regression leg, Regression (browser)
#                                          required, gateway container, migration readiness,
#                                          Moving image (push preview: on worker changes)
#   push main (integration)                changes, documentation, migration readiness, gateway
#                                          container when its inputs changed; no regression leg:
#                                          each change already passed its PR's ready CI
#   PR ready for review (opened/synchronize/reopened/ready_for_review, not draft)
#     documentation (reviewed prose only)  documentation job
#     openclaw-deploy (services/openclaw/lab/deploy/** only)
#                                          legs studio-admin-contracts + access-presentation,
#                                          gateway container
#     full (everything else)               every leg; Regression (browser) runs but does not
#                                          block (advisory); gateway container only when its
#                                          inputs changed (services/openclaw/lab/deploy/**, lab
#                                          root, .github/, .githooks/); Moving image on worker changes
#   PR draft                               changes + targeted (tools/precommit-checks.mjs --pr-diff);
#                                          the gate is named "CI (utkast)", so the required check CI
#                                          is missing and tools/merge-pr.mjs cannot merge the head
#
# The final gate job is the required check CI. It passes only when every job the
# classified scope requires reported success on this exact head.

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event and ref, so a queued push on main never replaces the nightly run.
  group: croupier-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A newer push to the same PR replaces the running check; main, preview,
  # nightly and manual runs are integration receipts and always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      migration: ${{ steps.scope.outputs.migration }}
      moving: ${{ steps.scope.outputs.moving }}
      gateway: ${{ steps.scope.outputs.gateway }}
      draft: ${{ steps.scope.outputs.draft }}
      browser: ${{ steps.scope.outputs.browser }}
      legs: ${{ steps.scope.outputs.legs }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/croupier.yml
            .github/actions/install-dependencies/action.yml
            .githooks/pre-commit-full
            test/ci-changes.mjs
            test/precommit-checks.mjs
            tools/ci-changes.mjs
            tools/documentation-paths.mjs
            tools/precommit-checks.mjs
            tools/check-push-target.mjs
            tools/check-repo-limits.mjs
            tools/repo-limits-allowlist.json
            test/check-repo-limits.mjs
            migrering/status.mjs
            migrering/status.json
            migrering/STATUS.md
      - name: Verify preinstalled Node 24
        run: node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('Preinstalled Node 24 is required')"
      - name: Verify CI selection and final gate
        run: node --test test/ci-changes.mjs
      - name: Classify the complete PR merge diff
        id: scope
        run: node tools/ci-changes.mjs
      # Repo growth: files over 1 MB only via the shrinking allowlist, no new media binaries, short living docs.
      - name: Repository size limits (shrinking allowlist)
        run: |
          node --test test/check-repo-limits.mjs
          node tools/check-repo-limits.mjs --tree HEAD --changed-since HEAD^1

  # Prose-only PRs and every push to main (integration scope).
  documentation:
    needs: changes
    if: needs.changes.outputs.scope == 'documentation' || needs.changes.outputs.scope == 'integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Environment registry and documentation contracts
        run: |
          node tools/check-environment-variables.mjs
          node migrering/status.mjs --check
          node --test test/check-environment-variables.mjs test/github-workflow.mjs test/precommit-checks.mjs test/inbox.mjs
          git diff --check HEAD^1 HEAD
      # PR caches are scoped to their own merge ref; only main-scoped entries are shared by
      # every PR. The regression no longer runs on push main, so this keeps the package-tree
      # entry current there: a lookup without download, and an install and save only when
      # a lockfile or manifest changed. It is cache upkeep, not a check, so it fails softly.
      - name: Keep the shared package-tree cache current on main
        if: needs.changes.outputs.scope == 'integration'
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/install-dependencies
        with:
          warm: 'true'

  # Draft PRs: the same targeted checks as the local pre-commit hook, on the PR
  # merge diff (syntax, registries, related tests, apps/web types, orphan tests
  # for new test files). No regression leg runs until the PR is ready for review.
  targeted:
    name: Targeted checks (draft)
    needs: changes
    if: needs.changes.outputs.draft == 'true' && needs.changes.outputs.scope != 'documentation'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install verified ffmpeg packages
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - name: Install locked package trees (one cache for every job)
        timeout-minutes: 10
        uses: ./.github/actions/install-dependencies
      - name: Targeted checks on the PR merge diff
        timeout-minutes: 15
        run: |
          node tools/precommit-checks.mjs --pr-diff --plan
          node tools/precommit-checks.mjs --pr-diff

  # Same registry as local --full (.githooks/pre-commit-full), split into four parallel
  # legs. The matrix comes from the classifier (REGRESSION_LEGS filtered by scope). Every
  # leg installs the same verified toolchain once (ffmpeg, then the package trees from one
  # shared cache); a leg runs its suites to the end and fails if any suite fails. Engine
  # runs only through its PostgreSQL harness, the container suite and the Chrome
  # acceptance have their own jobs.
  dealer-regression:
    name: Regression (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.legs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    outputs:
      # Only the lipsync leg runs this step; legs that skip it record no value.
      lipsync_verified: ${{ steps.lipsync_contracts.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install verified ffmpeg packages
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - name: Install locked package trees (one cache for every job)
        timeout-minutes: 10
        uses: ./.github/actions/install-dependencies
      - name: Restore Studio compiler cache
        if: ${{ matrix.build }}
        uses: actions/cache@v6
        with:
          path: apps/studio/.next/cache
          key: ${{ runner.os }}-studio-next-v1-${{ hashFiles('apps/studio/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-studio-next-v1-${{ hashFiles('apps/studio/package-lock.json') }}-
      - name: Build the real studio used by launcher regression tests
        if: ${{ matrix.build }}
        run: npm --prefix apps/studio run build
      # OpenClaw launcher acceptance runs in the access suite and needs the build above.
      - name: OpenClaw lab check
        if: ${{ matrix.build }}
        run: npm --prefix services/openclaw/lab run check
      - name: Orphan tests
        if: ${{ matrix.policy }}
        run: |
          node tools/check-orphan-tests.mjs || {
            echo "::error title=Orphan tests::Every test file must be registered. Add each listed file to a run_node_tests line of .githooks/pre-commit-full (the suite that owns its area: studio, admin, contracts, database, presentation, access, speech, gameplay, engine or container), or classify a helper/opt-in module in tools/orphan-tests-exceptions.json. Locally: node tools/check-orphan-tests.mjs (the pre-commit hook runs it when a test file is added)."
            exit 1
          }
      - name: Regression suites
        if: ${{ matrix.suites != '' }}
        timeout-minutes: 20
        shell: bash
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          # Later suites still diagnose failures; any failed suite fails the leg.
          failed=0
          for suite in $SUITES; do
            sh .githooks/pre-commit-full "$suite" || failed=1
          done
          exit "$failed"
      - name: Existing isolated Studio SQL, restart and HTTPS acceptance
        if: ${{ !cancelled() && matrix.postgres }}
        timeout-minutes: 12
        run: |
          # The runner image ships PostgreSQL 16 binaries; the download stays as fallback.
          if [ -x /usr/lib/postgresql/16/bin/initdb ] && [ -x /usr/lib/postgresql/16/bin/pg_ctl ]; then
            postgres_source=(--postgres-bin /usr/lib/postgresql/16/bin)
          else
            postgres_source=(--download-postgres)
          fi
          echo "PostgreSQL source: ${postgres_source[*]}"
          # Each group starts its own fresh loopback cluster. These groups have failed
          # on runner timing and passed unchanged on rerun, so a failed group runs one
          # more time, visibly (RETRY line and a warning annotation); a second failure
          # fails the step. No test is skipped or weakened.
          retry_once() {
            node tools/regression-group.mjs "$@" && return 0
            echo "[regression] RETRY $1 (attempt 2/2 on a fresh cluster)"
            echo "::warning title=Regression retry::$1 failed once in this run and was retried; see the first attempt above if it fails again."
            node tools/regression-group.mjs "$@"
          }
          retry_once database/isolated-sql-restart-https 360 node tools/studio-isolated-qa.mjs "${postgres_source[@]}"
          retry_once database/shared-blackjack 360 node tools/run-shared-table-qa.mjs "${postgres_source[@]}"
          retry_once database/shared-schema-upgrade 180 node tools/run-shared-table-qa.mjs --schema-upgrade "${postgres_source[@]}"
          retry_once database/lissabon-retirement 180 node tools/run-shared-table-qa.mjs --lissabon-retirement "${postgres_source[@]}"
          retry_once database/room-game-config 360 node tools/run-room-game-config-qa.mjs "${postgres_source[@]}"
      - name: Real engine over HTTP on isolated PostgreSQL with TLS
        if: ${{ !cancelled() && matrix.postgres }}
        timeout-minutes: 12
        run: |
          # The engine suite in .githooks/pre-commit-full skips without this harness;
          # here every file must run: verify-full TLS, SCRAM roles, one database per test.
          if [ -x /usr/lib/postgresql/16/bin/initdb ] && [ -x /usr/lib/postgresql/16/bin/pg_ctl ]; then
            postgres_source=(--postgres-bin /usr/lib/postgresql/16/bin)
          else
            postgres_source=(--download-postgres)
          fi
          echo "PostgreSQL source: ${postgres_source[*]}"
          node tools/regression-group.mjs engine/http-postgres 660 node tools/run-engine-qa.mjs "${postgres_source[@]}"
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && matrix.speech_node }}
        with:
          node-version: '24.21.0'
      - name: Speech transport on its declared Node runtime
        if: ${{ !cancelled() && matrix.speech_node }}
        run: |
          npm --prefix apps/speech run build
          node --test --test-concurrency=4 apps/web/test/platform-websocket.mjs test/platform-native-websocket.mjs test/platform-moving-speech.mjs
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && matrix.speech_node }}
        with:
          node-version: '24'
      - name: Select the worker Python without changing other checks
        if: ${{ matrix.lipsync }}
        id: lipsync_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          update-environment: false
      - name: Verify lipsync worker contracts in the prepared regression VM
        if: ${{ matrix.lipsync }}
        id: lipsync_contracts
        shell: bash
        timeout-minutes: 15
        env:
          LIPSYNC_PYTHON: ${{ steps.lipsync_python.outputs['python-path'] }}
        run: |
          npm --prefix services/astrid-gpu-worker/gateway test
          "$LIPSYNC_PYTHON" -m unittest discover -s services/astrid-gpu-worker/tests -v
          "$LIPSYNC_PYTHON" -m compileall -q services/astrid-gpu-worker/workers services/astrid-gpu-worker/handler.py
          bash -n services/astrid-gpu-worker/fetch/fetch-musetalk.sh
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Game rules split check
        if: ${{ !cancelled() && matrix.policy }}
        run: node test/split-rules.mjs
      - name: Delivery policy and team inbox
        if: ${{ !cancelled() && matrix.policy }}
        run: node --test --test-concurrency=4 test/github-workflow.mjs test/inbox.mjs
      - name: Save regression group timings
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dealer-regression-timing-${{ matrix.leg }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/dealer-regression-timing.jsonl

  # Real-browser acceptance (Chrome). The classifier output browser decides whether
  # the gate requires it: required on nightly, manual and preview runs; advisory on
  # ready full-scope PRs (it runs and reports, but a red result does not block CI).
  browser-regression:
    name: Regression (browser)
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.browser != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install verified ffmpeg packages
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - name: Install locked package trees (one cache for every job)
        timeout-minutes: 10
        uses: ./.github/actions/install-dependencies
      - name: Restore the pinned browser driver
        id: browser_driver
        uses: actions/cache@v6
        with:
          path: ~/.cache/croupier-browser-driver
          key: ${{ runner.os }}-playwright-core-1.62.1
      - name: Real browser acceptance (Chrome)
        timeout-minutes: 15
        shell: bash
        env:
          DRIVER_CACHED: ${{ steps.browser_driver.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
          driver="$HOME/.cache/croupier-browser-driver"
          if [ "$DRIVER_CACHED" != true ] || [ ! -f "$driver/node_modules/playwright-core/index.mjs" ]; then
            npm install --prefix "$driver" --no-save --package-lock=false --ignore-scripts \
              --no-audit --no-fund playwright-core@1.62.1
          fi
          # Every test file that reads the browser fixture runs here, so a new
          # browser test can never be skipped in CI by default. In the regression
          # legs the variable is unset and these cases skip.
          mapfile -t files < <(git grep -l -F -e process.env.CROUPIER_BROWSER_FIXTURE_MODULE -- ':(glob)test/*.mjs' ':(glob)apps/**/*.test.mjs' ':(glob)apps/web/test/*.mjs' | sort)
          test "${#files[@]}" -gt 0
          printf 'Browser test file: %s\n' "${files[@]}"
          CROUPIER_BROWSER_FIXTURE_MODULE="$driver/node_modules/playwright-core/index.mjs" \
          CROUPIER_BROWSER_FIXTURE_CHANNEL=chrome \
            node tools/regression-group.mjs browser/chrome 840 node --test --test-concurrency=2 --test-reporter=spec "${files[@]}"
      - name: Save regression group timings
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dealer-regression-timing-browser-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/dealer-regression-timing.jsonl

  # The pinned OpenClaw Gateway image build (about 90 s, mostly the base pull) runs
  # beside the regression legs instead of inside the access suite, and only when
  # its inputs changed (classifier output gateway: PR diff or main push range) or on
  # preview, nightly and manual runs.
  gateway-container:
    name: Gateway container
    needs: changes
    if: needs.changes.outputs.draft != 'true' && needs.changes.outputs.gateway == 'true' && needs.changes.outputs.scope != 'documentation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pinned Gateway image drops privilege and releases its lease on SIGTERM
        run: sh .githooks/pre-commit-full container

  migration-readiness:
    name: Studio migration readiness
    needs: changes
    # Main/preview/nightly/manual runs always check the ledger. Client/test-only PR
    # edits need no production access; server/schema/dependency changes still do,
    # once the PR is ready for review. Forks receive no production credentials; the
    # final gate rejects skipped readiness whenever the classified change requires it.
    if: ${{ needs.changes.outputs.migration == 'true' && needs.changes.outputs.draft != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm --prefix apps/studio ci
      - name: Studio migration readiness (production ledger)
        run: node tools/check-migration-readiness.mjs
        env:
          CROUPIER_GAME_DATABASE_URL: ${{ secrets.CROUPIER_GAME_DATABASE_URL }}

  moving-worker:
    needs: changes
    if: needs.changes.outputs.moving == 'true' && needs.changes.outputs.draft != 'true'
    uses: ./.github/workflows/moving-gpu-build.yml

  # The required check is named CI only for runs that can merge (push, schedule,
  # manual, PR ready for review). A draft run reports "CI (utkast)" instead, so the
  # ruleset and tools/merge-pr.mjs keep waiting for the real CI on that head.
  ci:
    name: ${{ needs.changes.outputs.draft == 'true' && 'CI (utkast)' || 'CI' }}
    needs: [changes, documentation, targeted, dealer-regression, browser-regression, gateway-container, migration-readiness, moving-worker]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          // Final gate script
          const jobs = JSON.parse(process.env.CI_NEEDS);
          const scope = jobs.changes?.outputs?.scope;
          const draft = jobs.changes?.outputs?.draft;
          const moving = jobs.changes?.outputs?.moving;
          const migration = jobs.changes?.outputs?.migration;
          const gateway = jobs.changes?.outputs?.gateway;
          const browser = jobs.changes?.outputs?.browser;
          let legs;
          try { legs = JSON.parse(jobs.changes?.outputs?.legs ?? ''); } catch { legs = null; }
          const fail = message => { console.error(`CI failed: ${message}`); process.exit(1); };
          if (jobs.changes?.result !== 'success' || !['true', 'false'].includes(draft) || !Array.isArray(legs)
            || !legs.every(leg => typeof leg === 'string' && leg)) fail('the change classification is missing or malformed.');
          // Prose-only PRs and pushes to main (integration) run the documentation job, no regression leg.
          const legless = scope === 'documentation' || scope === 'integration';
          if (!['required', 'advisory', 'none'].includes(browser) || (browser !== 'none' && (legless || draft === 'true'))) {
            fail('the browser selection is missing or contradicts the classification.');
          }
          if (draft === 'true') {
            // Targeted run only: nothing heavy may have run, and the targeted job must pass.
            const required = scope === 'documentation' ? ['documentation'] : ['targeted'];
            const idle = ['dealer-regression', 'browser-regression', 'gateway-container', 'migration-readiness', 'moving-worker', scope === 'documentation' ? 'targeted' : 'documentation'];
            if (scope === 'integration' || required.some(name => jobs[name]?.result !== 'success') || idle.some(name => jobs[name]?.result !== 'skipped')) {
              fail('a draft run requires the targeted (or documentation) job to pass and nothing else to run.');
            }
            console.log(`CI (utkast) passed: ${scope}; the required check CI runs when the PR is marked ready for review.`);
            process.exit(0);
          }
          const required = legless ? ['documentation'] : legs.length ? ['dealer-regression'] : [];
          if (browser === 'required') required.push('browser-regression');
          if (!['true', 'false'].includes(migration) || (scope === 'integration' && migration !== 'true')
            || (migration === 'true' && (scope === 'documentation'
              || jobs['migration-readiness']?.result !== 'success'))) {
            fail('required production migration readiness is missing or unsuccessful. Fork code must not receive production credentials; review and rerun from an authorized repository branch.');
          }
          if (!['true', 'false'].includes(gateway) || legless !== (legs.length === 0)
            || jobs['gateway-container']?.result !== (gateway === 'true' && scope !== 'documentation' ? 'success' : 'skipped')) {
            fail('the Gateway container check is missing, failed, or ran against the classification.');
          }
          if ((legless && jobs['dealer-regression']?.result !== 'skipped')
            || (browser === 'none' && jobs['browser-regression']?.result !== 'skipped')) {
            fail('a regression job ran against the classification.');
          }
          if (!['true', 'false'].includes(moving)
            || jobs['moving-worker']?.result !== (moving === 'true' ? 'success' : 'skipped')
            || jobs.targeted?.result !== 'skipped' || required.length === 0
            || (legs.includes('speech-gameplay') && jobs['dealer-regression']?.outputs?.lipsync_verified !== 'true')
            || required.some(name => jobs[name]?.result !== 'success')) {
            fail('a required check failed, was cancelled, skipped, or was not reported.');
          }
          // Advisory: a ready PR reports Chrome acceptance without waiting on it; the nightly run on main requires it.
          const chrome = jobs['browser-regression']?.result;
          if (browser === 'advisory' && chrome !== 'success') {
            console.log(`::warning title=Regression (browser)::Chrome acceptance reported ${chrome ?? 'nothing'}. It does not block this PR; the nightly run on main requires it.`);
          }
          console.log(`CI passed: ${scope} (${legs.join(', ') || 'no regression legs'}; browser ${browser})`);
          NODE
