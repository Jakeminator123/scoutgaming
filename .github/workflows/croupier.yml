name: Croupier GitHub checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: croupier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm --prefix lab ci
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - run: npm --prefix lab test
      - run: npm --prefix lab run build
      - run: npm --prefix open-claw/lab test
      - run: npm --prefix open-claw/lab run check

  dealer-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
      - run: npm --prefix lab ci
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - name: Build the real studio used by launcher regression tests
        run: npm --prefix lab run build
      - name: Install the real Next middleware used by frontend regression tests
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - run: pnpm --dir apps/croupier-frontend install --frozen-lockfile
      - name: Shared pre-commit regression suite
        run: sh .githooks/pre-commit --full
      - run: node pipeline/audit-dealer-sync.mjs --probe
      - run: node pipeline/audit-performance.mjs --probe
      - run: node pipeline/audit-astrid-actor.mjs --probe
      - run: node test/shoe-game.mjs
      - run: node test/table-http.mjs
      - run: node test/split-rules.mjs
      - run: node --test test/croupier-inbox.mjs test/croupier-chef.mjs test/github-workflow.mjs test/cloud-readiness.mjs
      - run: node --test ops/cloud/test/*.test.mjs

  lipsync-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway test
      - run: python -m unittest discover -s services/astrid-gpu-worker/tests -v
      - run: python -m compileall -q services/astrid-gpu-worker/workers services/astrid-gpu-worker/handler.py
      - run: bash -n services/astrid-gpu-worker/fetch/fetch-musetalk.sh
