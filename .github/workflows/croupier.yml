name: Croupier GitHub checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: croupier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - name: Install ffmpeg when missing
        timeout-minutes: 8
        run: |
          packages=""
          { command -v ffmpeg && command -v ffprobe; } >/dev/null 2>&1 || packages="ffmpeg"
          if [ -n "$packages" ]; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
                && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq $packages; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 20
            done
          fi
          ffmpeg -version | head -n 1
      - run: npm --prefix lab ci
      - name: Studio migration readiness (production ledger)
        # Runs for pushes to main and for pull requests from branches in this
        # repository. Fork PRs do not receive secrets and would fail closed.
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: node tools/check-migration-readiness.mjs
        env:
          CROUPIER_GAME_DATABASE_URL: ${{ secrets.CROUPIER_GAME_DATABASE_URL }}
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - run: npm --prefix lab test
      - run: npm --prefix lab run build
      - run: npm --prefix open-claw/lab test
      - run: npm --prefix open-claw/lab run check

  dealer-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lab/package-lock.json
      - name: Install ffmpeg and jq when missing
        timeout-minutes: 8
        run: |
          packages=""
          { command -v ffmpeg && command -v ffprobe; } >/dev/null 2>&1 || packages="ffmpeg"
          command -v jq >/dev/null 2>&1 || packages="$packages jq"
          if [ -n "$packages" ]; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
                && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq $packages; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 20
            done
          fi
          ffmpeg -version | head -n 1
          jq --version
      - run: npm --prefix lab ci
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - name: Build the real studio used by launcher regression tests
        run: npm --prefix lab run build
      - name: Install the real Next middleware used by frontend regression tests
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - run: pnpm --dir apps/croupier-frontend install --frozen-lockfile
      - name: Check system map against this commit and capture test inputs
        run: |
          mkdir -p "$RUNNER_TEMP/system-map-evidence"
          node docs/system-map/verify.mjs --check --ref "$GITHUB_SHA"
          node tools/system-map-evidence.mjs --capture --ref "$GITHUB_SHA" --output "$RUNNER_TEMP/system-map-inputs.json"
      - name: Shared pre-commit regression suite
        env:
          CROUPIER_SYSTEM_MAP_EVIDENCE_DIR: ${{ runner.temp }}/system-map-evidence
        run: sh .githooks/pre-commit --full
      - name: Existing isolated Studio SQL, restart and HTTPS acceptance
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/system-map-evidence"
          # The runner image ships PostgreSQL 16 binaries; the download stays as fallback.
          if [ -x /usr/lib/postgresql/16/bin/initdb ] && [ -x /usr/lib/postgresql/16/bin/pg_ctl ]; then
            postgres_source=(--postgres-bin /usr/lib/postgresql/16/bin)
          else
            postgres_source=(--download-postgres)
          fi
          echo "PostgreSQL source: ${postgres_source[*]}"
          node tools/system-map-evidence.mjs --run-isolated-qa "${postgres_source[@]}" --report-output "$RUNNER_TEMP/system-map-evidence/studio-isolated-qa.jsonl"
      - name: Build system map with the existing regression results
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/system-map-inputs.json" ]; then exit 1; fi
          set --
          for report in "$RUNNER_TEMP/system-map-evidence"/*.jsonl; do
            if [ -f "$report" ]; then set -- "$@" --report "$report"; fi
          done
          node tools/system-map-evidence.mjs --snapshot "$RUNNER_TEMP/system-map-inputs.json" "$@" --ci-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --output "$RUNNER_TEMP/system-map-evidence.json"
          map_status=0
          node docs/system-map/verify.mjs --check --ref "$GITHUB_SHA" --evidence "$RUNNER_TEMP/system-map-evidence.json" --json "$RUNNER_TEMP/system-map-status.json" || map_status=$?
          cp docs/system-map/index.html "$RUNNER_TEMP/croupier-system-map.html"
          node docs/system-map/build.mjs --ref "$GITHUB_SHA" --evidence "$RUNNER_TEMP/system-map-evidence.json" --output "$RUNNER_TEMP/croupier-system-map.html"
          exit "$map_status"
      - name: Save version-bound map and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: croupier-system-map-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/croupier-system-map.html
            ${{ runner.temp }}/system-map-evidence.json
            ${{ runner.temp }}/system-map-status.json
      - run: node pipeline/audit-dealer-sync.mjs --probe
      - run: node pipeline/audit-performance.mjs --probe
      - run: node pipeline/audit-astrid-actor.mjs --probe
      - run: node test/table-http.mjs
      - run: node test/split-rules.mjs
      - run: node --test test/croupier-inbox.mjs test/croupier-chef.mjs test/github-workflow.mjs test/cloud-readiness.mjs test/inbox.mjs
      - run: node --test ops/cloud/test/*.test.mjs

  lipsync-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ffmpeg when missing
        timeout-minutes: 8
        run: |
          packages=""
          { command -v ffmpeg && command -v ffprobe; } >/dev/null 2>&1 || packages="ffmpeg"
          if [ -n "$packages" ]; then
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq \
                && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y -qq $packages; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 20
            done
          fi
          ffmpeg -version | head -n 1
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway test
      - run: python -m unittest discover -s services/astrid-gpu-worker/tests -v
      - run: python -m compileall -q services/astrid-gpu-worker/workers services/astrid-gpu-worker/handler.py
      - run: bash -n services/astrid-gpu-worker/fetch/fetch-musetalk.sh
