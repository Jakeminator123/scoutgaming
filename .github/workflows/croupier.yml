name: Croupier GitHub checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: croupier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      migration: ${{ steps.scope.outputs.migration }}
      moving: ${{ steps.scope.outputs.moving }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/croupier.yml
            .githooks/pre-commit-full
            test/ci-changes.mjs
            test/precommit-checks.mjs
            tools/ci-changes.mjs
            tools/documentation-paths.mjs
            tools/precommit-checks.mjs
            tools/check-push-target.mjs
            migrering/status.mjs
            migrering/status.json
            migrering/STATUS.md
      - name: Verify preinstalled Node 24
        run: node -e "if (process.versions.node.split('.')[0] !== '24') throw new Error('Preinstalled Node 24 is required')"
      - name: Verify CI selection and final gate
        run: node --test test/ci-changes.mjs
      - name: Classify the complete PR merge diff
        id: scope
        run: node tools/ci-changes.mjs

  documentation:
    needs: changes
    if: needs.changes.outputs.scope == 'documentation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Environment registry and documentation contracts
        run: |
          node tools/check-environment-variables.mjs
          node migrering/status.mjs --check
          node --test test/check-environment-variables.mjs test/github-workflow.mjs test/precommit-checks.mjs test/inbox.mjs
          git diff --check HEAD^1 HEAD

  # Same registry as local --full (.githooks/pre-commit-full), split into parallel legs.
  # Every leg gets the same verified toolchain; a leg runs its suites to the end and
  # fails if any suite fails. Engine runs only through its PostgreSQL harness, and the
  # container suite has its own job.
  dealer-regression:
    name: Regression (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: studio
            suites: studio
          - leg: admin-contracts
            suites: admin contracts
            policy: true
          - leg: database-engine
            suites: database
            postgres: true
          - leg: presentation
            suites: presentation
          - leg: access
            suites: access
            build: true
          - leg: speech-gameplay
            suites: speech gameplay
            speech_node: true
            lipsync: true
          - leg: browser
            suites: ''
            browser: true
    outputs:
      # Only the lipsync leg runs this step; legs that skip it record no value.
      lipsync_verified: ${{ steps.lipsync_contracts.outputs.verified }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/studio/package-lock.json
            apps/studio/client/package-lock.json
            apps/speech/package-lock.json
            services/game/package-lock.json
            services/astrid-gpu-worker/gateway/package-lock.json
      - name: Install verified ffmpeg packages
        timeout-minutes: 8
        uses: ./.github/actions/setup-ffmpeg
      - run: npm --prefix apps/studio ci
      # Bundled Admin and lobby component tests resolve the client's own packages.
      # The access leg gets them from the real Studio build below.
      - name: Install the Admin and lobby client packages
        if: ${{ !matrix.build }}
        run: npm --prefix apps/studio/client ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: npm --prefix services/game ci --ignore-scripts
      - run: npm --prefix services/astrid-gpu-worker/gateway ci --ignore-scripts
      - name: Install the speech service's own locked transport
        run: npm --prefix apps/speech ci --ignore-scripts
      - name: Install the real Next middleware used by frontend regression tests
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false
      - run: pnpm --dir apps/web install --frozen-lockfile
      - name: Restore Studio compiler cache
        if: ${{ matrix.build }}
        uses: actions/cache@v6
        with:
          path: apps/studio/.next/cache
          key: ${{ runner.os }}-studio-next-v1-${{ hashFiles('apps/studio/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-studio-next-v1-${{ hashFiles('apps/studio/package-lock.json') }}-
      - name: Build the real studio used by launcher regression tests
        if: ${{ matrix.build }}
        run: npm --prefix apps/studio run build
      # OpenClaw launcher acceptance runs in the access suite and needs the build above.
      - name: OpenClaw lab check
        if: ${{ matrix.build }}
        run: npm --prefix services/openclaw/lab run check
      - name: Orphan tests
        if: ${{ matrix.policy }}
        run: node tools/check-orphan-tests.mjs
      - name: Regression suites
        if: ${{ matrix.suites != '' }}
        timeout-minutes: 20
        shell: bash
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          # Later suites still diagnose failures; any failed suite fails the leg.
          failed=0
          for suite in $SUITES; do
            sh .githooks/pre-commit-full "$suite" || failed=1
          done
          exit "$failed"
      - name: Existing isolated Studio SQL, restart and HTTPS acceptance
        if: ${{ !cancelled() && matrix.postgres }}
        timeout-minutes: 8
        run: |
          # The runner image ships PostgreSQL 16 binaries; the download stays as fallback.
          if [ -x /usr/lib/postgresql/16/bin/initdb ] && [ -x /usr/lib/postgresql/16/bin/pg_ctl ]; then
            postgres_source=(--postgres-bin /usr/lib/postgresql/16/bin)
          else
            postgres_source=(--download-postgres)
          fi
          echo "PostgreSQL source: ${postgres_source[*]}"
          node tools/regression-group.mjs database/isolated-sql-restart-https 360 node tools/studio-isolated-qa.mjs "${postgres_source[@]}"
          node tools/regression-group.mjs database/shared-blackjack 360 node tools/run-shared-table-qa.mjs "${postgres_source[@]}"
          node tools/regression-group.mjs database/shared-schema-upgrade 180 node tools/run-shared-table-qa.mjs --schema-upgrade "${postgres_source[@]}"
          node tools/regression-group.mjs database/lissabon-retirement 180 node tools/run-shared-table-qa.mjs --lissabon-retirement "${postgres_source[@]}"
          node tools/regression-group.mjs database/room-game-config 360 node tools/run-room-game-config-qa.mjs "${postgres_source[@]}"
      - name: Real engine over HTTP on isolated PostgreSQL with TLS
        if: ${{ !cancelled() && matrix.postgres }}
        timeout-minutes: 12
        run: |
          # The engine suite in .githooks/pre-commit-full skips without this harness;
          # here every file must run: verify-full TLS, SCRAM roles, one database per test.
          if [ -x /usr/lib/postgresql/16/bin/initdb ] && [ -x /usr/lib/postgresql/16/bin/pg_ctl ]; then
            postgres_source=(--postgres-bin /usr/lib/postgresql/16/bin)
          else
            postgres_source=(--download-postgres)
          fi
          echo "PostgreSQL source: ${postgres_source[*]}"
          node tools/regression-group.mjs engine/http-postgres 660 node tools/run-engine-qa.mjs "${postgres_source[@]}"
      - name: Restore the pinned browser driver
        if: ${{ matrix.browser }}
        id: browser_driver
        uses: actions/cache@v6
        with:
          path: ~/.cache/croupier-browser-driver
          key: ${{ runner.os }}-playwright-core-1.62.1
      - name: Real browser acceptance (Chrome)
        if: ${{ matrix.browser }}
        timeout-minutes: 15
        shell: bash
        env:
          DRIVER_CACHED: ${{ steps.browser_driver.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
          driver="$HOME/.cache/croupier-browser-driver"
          if [ "$DRIVER_CACHED" != true ] || [ ! -f "$driver/node_modules/playwright-core/index.mjs" ]; then
            npm install --prefix "$driver" --no-save --package-lock=false --ignore-scripts \
              --no-audit --no-fund playwright-core@1.62.1
          fi
          # Every test file that reads the browser fixture runs here, so a new
          # browser test can never be skipped in CI by default. In the suites
          # above the variable is unset and these cases skip.
          mapfile -t files < <(git grep -l -F -e process.env.CROUPIER_BROWSER_FIXTURE_MODULE -- ':(glob)test/*.mjs' ':(glob)apps/**/*.test.mjs' ':(glob)apps/web/test/*.mjs' | sort)
          test "${#files[@]}" -gt 0
          printf 'Browser test file: %s\n' "${files[@]}"
          CROUPIER_BROWSER_FIXTURE_MODULE="$driver/node_modules/playwright-core/index.mjs" \
          CROUPIER_BROWSER_FIXTURE_CHANNEL=chrome \
            node tools/regression-group.mjs browser/chrome 840 node --test --test-concurrency=2 --test-reporter=spec "${files[@]}"
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && matrix.speech_node }}
        with:
          node-version: '22.23.1'
      - name: Speech transport on its declared Node runtime
        if: ${{ !cancelled() && matrix.speech_node }}
        run: |
          npm --prefix apps/speech run build
          node --test --test-concurrency=4 apps/web/test/platform-websocket.mjs test/platform-native-websocket.mjs test/platform-moving-speech.mjs
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && matrix.speech_node }}
        with:
          node-version: '24'
      - name: Select the worker Python without changing other checks
        if: ${{ matrix.lipsync }}
        id: lipsync_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          update-environment: false
      - name: Verify lipsync worker contracts in the prepared regression VM
        if: ${{ matrix.lipsync }}
        id: lipsync_contracts
        shell: bash
        timeout-minutes: 15
        env:
          LIPSYNC_PYTHON: ${{ steps.lipsync_python.outputs['python-path'] }}
        run: |
          npm --prefix services/astrid-gpu-worker/gateway test
          "$LIPSYNC_PYTHON" -m unittest discover -s services/astrid-gpu-worker/tests -v
          "$LIPSYNC_PYTHON" -m compileall -q services/astrid-gpu-worker/workers services/astrid-gpu-worker/handler.py
          bash -n services/astrid-gpu-worker/fetch/fetch-musetalk.sh
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Game rules split check
        if: ${{ !cancelled() && matrix.policy }}
        run: node test/split-rules.mjs
      - name: Delivery policy and team inbox
        if: ${{ !cancelled() && matrix.policy }}
        run: node --test --test-concurrency=4 test/github-workflow.mjs test/inbox.mjs
      - name: Save regression group timings
        continue-on-error: true
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dealer-regression-timing-${{ matrix.leg }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/dealer-regression-timing.jsonl

  # The pinned OpenClaw Gateway image build (about 90 s, mostly the base pull) runs
  # beside the regression legs instead of inside the access suite.
  gateway-container:
    name: Gateway container
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pinned Gateway image drops privilege and releases its lease on SIGTERM
        run: sh .githooks/pre-commit-full container

  migration-readiness:
    name: Studio migration readiness
    needs: changes
    # Main/manual runs always check the ledger. Client/test-only PR edits
    # need no production access; server/schema/dependency changes still do.
    # Forks receive no production credentials; the final gate rejects
    # skipped readiness whenever the classified change requires it.
    if: ${{ needs.changes.outputs.migration == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm --prefix apps/studio ci
      - name: Studio migration readiness (production ledger)
        run: node tools/check-migration-readiness.mjs
        env:
          CROUPIER_GAME_DATABASE_URL: ${{ secrets.CROUPIER_GAME_DATABASE_URL }}

  moving-worker:
    needs: changes
    if: needs.changes.outputs.moving == 'true'
    uses: ./.github/workflows/moving-gpu-build.yml

  ci:
    name: CI
    needs: [changes, documentation, dealer-regression, gateway-container, migration-readiness, moving-worker]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every applicable check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          // Final gate script
          const jobs = JSON.parse(process.env.CI_NEEDS);
          const scope = jobs.changes?.outputs?.scope;
          const required = scope === 'documentation' ? ['documentation']
            : scope === 'full' ? ['dealer-regression', 'gateway-container'] : [];
          const moving = jobs.changes?.outputs?.moving;
          const migration = jobs.changes?.outputs?.migration;
          if (!['true', 'false'].includes(migration)
            || (migration === 'true' && (scope !== 'full'
              || jobs['migration-readiness']?.result !== 'success'))) {
            console.error('CI failed: required production migration readiness is missing or unsuccessful. Fork code must not receive production credentials; review and rerun from an authorized repository branch.');
            process.exit(1);
          }
          if (!['true', 'false'].includes(moving)
            || jobs['moving-worker']?.result !== (moving === 'true' ? 'success' : 'skipped')
            || jobs.changes?.result !== 'success' || required.length === 0
            || (scope === 'full' && jobs['dealer-regression']?.outputs?.lipsync_verified !== 'true')
            || required.some(name => jobs[name]?.result !== 'success')) {
            console.error('CI failed: a required check failed, was cancelled, skipped, or was not reported.');
            process.exit(1);
          }
          console.log(`CI passed: ${scope}`);
          NODE
