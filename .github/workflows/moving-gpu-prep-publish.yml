name: Publish private Moving GPU prep image

on:
  workflow_dispatch:
    inputs:
      approved_target:
        description: 'Exact approved GHCR path: ghcr.io/jakeminator123/moving-gpu-worker'
        required: true
        type: string
      expected_head:
        description: 'Full reviewed main SHA; must equal dispatch head'
        required: true
        type: string
      expected_release:
        description: 'Reviewed prep release SHA256 from build.py --check'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: moving-gpu-prep-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Jakeminator123/scoutgaming' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/jakeminator123/moving-gpu-worker
      APPROVED_TARGET: ${{ inputs.approved_target }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      EXPECTED_RELEASE: ${{ inputs.expected_release }}
    steps:
      - name: Require approved target and frozen main head
        run: |
          python3 - <<'PY'
          import os, re
          assert os.environ['APPROVED_TARGET'] == os.environ['IMAGE'] == 'ghcr.io/jakeminator123/moving-gpu-worker'
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['EXPECTED_HEAD'])
          assert os.environ['EXPECTED_HEAD'] == os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[a-f0-9]{64}', os.environ['EXPECTED_RELEASE'])
          PY
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            services/moving-gpu-prep
            services/astrid-gpu-worker/workers
            tools
      - name: Verify reviewed release and focused integrity tests
        working-directory: services/moving-gpu-prep
        run: |
          python3 - <<'PY'
          import os
          from contracts import verify_release
          assert verify_release() == os.environ['EXPECTED_RELEASE']
          PY
          python3 build.py --check
          python3 -B -m unittest discover -s tests -v
      - name: Require the existing private destination before any image build or push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 services/moving-gpu-prep/publication.py --before
      - name: Authenticate for private base pull and approved publication
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and verify on CPU without runtime network
        run: |
          python3 services/moving-gpu-prep/build.py --tag moving-gpu-prep:publish
          docker run --rm --network none --entrypoint /workspace/mt-venv/bin/python moving-gpu-prep:publish -B /opt/moving-prep/verify_runtime.py
          docker run --rm --network none moving-gpu-prep:publish --help
      - name: Publish only the verified image to the still-private destination
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 services/moving-gpu-prep/publication.py --before
          docker tag moving-gpu-prep:publish "$IMAGE:prep-sha-$GITHUB_SHA"
          docker push "$IMAGE:prep-sha-$GITHUB_SHA"
      - name: Verify private publication and record immutable digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 services/moving-gpu-prep/publication.py --after
      - name: Remove runner registry login
        if: always()
        run: docker logout ghcr.io
