<!doctype html>
<html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astrid bild och ljud · syntetisk QA</title><link rel="stylesheet" href="/styles.css">
<style>body{margin:0;padding:24px;background:#101618;color:#eee;font:16px system-ui;overflow:auto}main{max-width:760px}button{padding:10px;margin:8px}pre{white-space:pre-wrap}#fixture{min-height:80px}.astrid-camera-panel{position:relative;top:auto;right:auto;margin-top:12px}#astrid-camera{width:min(380px,90vw)}#astrid-camera summary{display:inline-block}h1{font-size:24px}</style>
<main><h1>Astrid bild och ljud · syntetisk QA</h1>
<p>Ingen riktig kamera, mikrofon, spelprofil, databas eller modell används. Komponentprovet spelar in en syntetisk ton via riktig AudioWorklet men ersätter transkriptionssvaret. Inget ljud lämnar webbläsaren.</p>
<button id="run">Kör syntetiska kamerafall</button>
<button id="voice">Verifiera lokal ljudinspelning med testljud</button>
<p id="capability"></p><pre id="results" role="status">Redo</pre><div id="fixture"></div>
</main>
<script type="module">
import { createAstridCameraControl } from '/astrid-camera-control.mjs';
import { createAstridAudioRecorder } from '/astrid-camera-audio.mjs';
const results = document.querySelector('#results'), fixture = document.querySelector('#fixture');
const write = value => { results.textContent += '\n' + value; };
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
const until = async check => { for (let n = 0; n < 120; n++) { if (check()) return; await pause(100); } throw new Error('timeout'); };
const assert = (ok, message) => { if (!ok) throw new Error(message); };
document.querySelector('#capability').textContent = `AudioWorklet: ${Boolean(window.AudioWorkletNode)} · ${navigator.userAgent}`;
let lastControl;
document.querySelector('#run').onclick = async event => {
  event.target.disabled = true; results.textContent = 'Kör…';
  try {
    for (const [name, speech, expected] of [['tystnad', 0, 0], ['kort tal', 900, 1], ['långt tal', 3800, 2], ['tal med kort paus', 3800, 2]]) {
      lastControl?.stop(); fixture.replaceChildren();
      let tracks = [], sourceAudio, toneGain, drawTimer, permissionCalls = 0, sent = 0, uploads = 0;
      const mediaDevices = { getUserMedia: async () => {
        permissionCalls++; const canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 480;
        const ctx = canvas.getContext('2d'); let frame = 0;
        const draw = () => { ctx.fillStyle = frame++ % 2 ? '#1266af' : '#21aa65'; ctx.fillRect(0, 0, 640, 480); ctx.fillStyle = 'white'; ctx.font = '40px sans-serif'; ctx.fillText('SYNTHETIC QA', 120, 240); };
        draw(); drawTimer = setInterval(draw, 100);
        const video = canvas.captureStream(12); sourceAudio = new AudioContext(); await sourceAudio.resume();
        const destination = sourceAudio.createMediaStreamDestination(), oscillator = sourceAudio.createOscillator(); toneGain = sourceAudio.createGain();
        oscillator.frequency.value = 400; oscillator.connect(toneGain); toneGain.connect(destination); toneGain.gain.value = 0; oscillator.start();
        const stream = new MediaStream([...video.getVideoTracks(), ...destination.stream.getAudioTracks()]); tracks = stream.getTracks(); return stream;
      } };
      try {
        const control = createAstridCameraControl({ container: fixture,
          identity: () => ({ playerId: 'synthetic', dealerId: 'astrid', sessionRevision: 'qa', roundRevision: '0' }), mediaDevices,
          createRecorder: async options => {
            const recorder = await createAstridAudioRecorder(options), at = sourceAudio.currentTime;
            if (speech) {
              toneGain.gain.setValueAtTime(0.1, at + 0.2); toneGain.gain.setValueAtTime(0, at + (speech + 200) / 1000);
              if (name.includes('paus')) { toneGain.gain.setValueAtTime(0, at + 1.5); toneGain.gain.setValueAtTime(0.1, at + 1.8); }
            }
            return recorder;
          },
          fetchImpl: async (url, init) => {
            if (url.endsWith('/transcription')) {
              uploads++; assert(tracks.every(track => track.readyState === 'ended'), 'upload before devices stop');
              assert(init.body instanceof Uint8Array && init.body.length > 44, 'missing recorded WAV');
              return { ok: true, json: async () => ({ text: 'Synthetic camera test' }) };
            }
            return { ok: true, json: async () => ({ enabled: true, profileRevision: 'a'.repeat(64), transcription: { enabled: true } }) };
          },
          send: async ({ message, images }) => { assert(message === 'Synthetic camera test', 'wrong transcript'); assert(images.length === expected, 'send count'); sent++; return true; },
        });
        lastControl = control; await pause(0);
        assert(permissionCalls === 0, 'off requested devices'); fixture.querySelector('details').open = true; await pause(0);
        [...fixture.querySelectorAll('button')].find(button => button.textContent === 'Starta kamera och mikrofon').click();
        await until(() => fixture.querySelector('summary').textContent.endsWith('· På'));
        if (!speech) { await pause(600); [...fixture.querySelectorAll('button')].find(button => button.textContent === 'Stoppa').click(); }
        await until(() => !fixture.querySelector('.astrid-camera-review').hidden && ![...fixture.querySelectorAll('button')].find(button => button.textContent === 'Skicka till Astrid').disabled);
        const images = [...fixture.querySelectorAll('.astrid-camera-pictures img')];
        assert(images.length === expected, `${name}: expected ${expected}, got ${images.length}`);
        for (const img of images) { await img.decode(); assert(Math.max(img.naturalWidth, img.naturalHeight) <= 384, 'dimensions'); assert(atob(img.src.split(',')[1]).length <= 65536, 'bytes'); }
        assert(tracks.length === 2 && tracks.every(track => track.readyState === 'ended'), 'tracks still live'); assert(sent === 0, 'sent before review');
        assert(uploads === (speech ? 1 : 0), 'unexpected transcription uploads');
        if (expected) { [...fixture.querySelectorAll('button')].find(button => button.textContent === 'Skicka till Astrid').click(); await until(() => sent === 1); }
        write(`PASS ${name}: ${images.length} JPEG, riktig lokal ljudinspelning, tracks stoppade, explicit granskning.`);
      } finally { lastControl?.stop(); clearInterval(drawTimer); tracks.forEach(track => track.stop()); await sourceAudio?.close(); }
    }
    write('PASS komponentprov klart. Inget verkligt ljud eller transkriptionsanrop.');
  } catch (error) { lastControl?.stop(); write('FAIL ' + error.message); } finally { event.target.disabled = false; }
};
document.querySelector('#voice').onclick = async event => {
  event.target.disabled = true;
  let context, stream, recorder;
  const controller = new AbortController();
  try {
    context = new AudioContext(); await context.resume();
    const response = await fetch('/dealers/astrid/audio/en/goodluck.mp3');
    if (!response.ok) throw new Error(`Testljudet saknas (${response.status}).`);
    const buffer = await context.decodeAudioData(await response.arrayBuffer());
    const source = context.createBufferSource(); source.buffer = buffer;
    const destination = context.createMediaStreamDestination(); source.connect(destination); stream = destination.stream;
    let activity = 0;
    recorder = await createAstridAudioRecorder({ stream, AudioContextClass: AudioContext, AudioWorkletNodeClass: AudioWorkletNode,
      signal: controller.signal, onSample: sample => { if (sample.speaking) activity++; } });
    const ended = new Promise(resolve => { source.onended = resolve; }); source.start(); await ended; await pause(200);
    const wav = recorder.stop(); assert(wav?.length > 44 && activity > 0, 'saknar ljud eller lokal aktivitet');
    write(`PASS befintligt Astrid-testljud genom riktig AudioWorklet: ${wav.length} WAV-bytes, ${activity} aktivitetsprov. Transkription är inte provad här.`);
    wav.fill(0);
  } catch (error) { write('LJUD: ' + error.message); } finally { controller.abort(); recorder?.stop(true); stream?.getTracks().forEach(track => track.stop()); await context?.close(); event.target.disabled = false; }
};
</script></html>
