stages:
  - test

dealer-regression:
  image: node:22-bookworm
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq ffmpeg jq
  script:
    - node pipeline/audit-dealer-sync.mjs --probe
    - node pipeline/audit-performance.mjs --probe
    - node pipeline/audit-astrid-actor.mjs --probe
    - node --test test/build-index.mjs test/dealer-sync-audit.mjs test/speech-playback.mjs test/animation-clock.mjs test/dealing-cues.mjs test/movement-cues.mjs test/casino-navigation.mjs
    - node test/shoe-game.mjs
    - node test/table-http.mjs
    - node --test test/performance-contact.mjs test/pack-contact-media.mjs test/table-audio.mjs
    - node --test test/action-placement.mjs test/bugshot-report.mjs
    - node test/split-rules.mjs
    - node test/blackjack-asset-state.mjs
    - node --test test/dealer-motion.mjs test/dealer-skin-contact.mjs
    - node --test test/rigged-card-layout.mjs test/rigged-layout-contact.mjs test/rigged-discard-state.mjs
    - node --test test/dealer-face.mjs test/rigged-face-playback.mjs test/rigged-face-bindings.mjs
