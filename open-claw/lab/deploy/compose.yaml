# Run from Croupier root:
# docker compose --env-file .env -f open-claw/lab/deploy/compose.yaml up --build
# Only the narrow Director is published, and only on the laptop loopback.
name: croupier-openclaw-lab
services:
  director:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:4189:4188
    environment:
      HOST: 0.0.0.0
      PORT: 4188
      LAB_DATA_DIR: /data/catalog
      LAB_API_TOKEN: ${LAB_API_TOKEN:?Set a separate LAB_API_TOKEN}
      OPENCLAW_BASE_URL: http://gateway:18789
      OPENCLAWAPI_KEY: ${OPENCLAWAPI_KEY:?Set OPENCLAWAPI_KEY}
      OPENCLAW_AGENT: openclaw/croupier-director
      OPENCLAW_CHAT_AGENT: openclaw/croupier-chat
      OPENCLAW_TIMEOUT_MS: ${OPENCLAW_TIMEOUT_MS:-2500}
    volumes:
      - lab-catalog:/data/catalog
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      OPENCLAWAPI_KEY: ${OPENCLAWAPI_KEY:?Set OPENCLAWAPI_KEY}
      OPENCLAW_MODEL_API_KEY: ${OPENCLAW_MODEL_API_KEY:?Set the separate provider credential OPENCLAW_MODEL_API_KEY}
      OPENCLAW_MODEL_BASE_URL: ${OPENCLAW_MODEL_BASE_URL:-https://api.openai.com/v1}
      OPENCLAW_MODEL_ID: ${OPENCLAW_MODEL_ID:-gpt-5.4-mini}
      OPENCLAW_MODEL_API: ${OPENCLAW_MODEL_API:-openai-responses}
      OPENCLAW_GATEWAY_PORT: 18789
      OPENCLAW_STATE_DIR: /data/openclaw
      OPENCLAW_CONFIG_PATH: /data/openclaw/openclaw.json
    volumes:
      - openclaw-state:/data/openclaw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4
    restart: unless-stopped
volumes:
  lab-catalog:
  openclaw-state:
