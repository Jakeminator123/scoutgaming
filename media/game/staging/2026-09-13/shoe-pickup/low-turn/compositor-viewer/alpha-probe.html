<!doctype html><meta charset="utf-8"><title>Native alpha capability diagnostic</title><style>body{background:#333;color:white;font:16px system-ui}video{display:block;width:320px;background:repeating-conic-gradient(#888 0% 25%,#333 0% 50%) 0/32px 32px}</style><h1>Native alpha capability diagnostic</h1><p>Synthetic samples only. No gameplay acceptance.</p><button id="run">Test both formats</button><pre id="result"></pre><script type="module">
const result=document.querySelector('#result');const receipts=[];
for(const [name,src] of [['420','/probe-420.webm'],['gbr','/probe-gbr.webm']]){const label=document.createElement('p');label.textContent=name;document.body.append(label);const v=document.createElement('video');v.src=src;v.muted=true;v.playsInline=true;v.preload='auto';document.body.append(v);v.dataset.name=name;}
document.querySelector('#run').onclick=async()=>{receipts.length=0;for(const v of document.querySelectorAll('video')){const entry={format:v.dataset.name};try{await v.play();await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('No decoded frame callback within 3s')),3000);v.requestVideoFrameCallback((_,m)=>{clearTimeout(timer);entry.mediaTime=m.mediaTime;resolve();});});v.pause();const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0);const rgba=ctx.getImageData(0,0,c.width,c.height).data;const counts={zero:0,partial:0,opaque:0};for(let i=3;i<rgba.length;i+=4){if(rgba[i]===0)counts.zero++;else if(rgba[i]===255)counts.opaque++;else counts.partial++;}Object.assign(entry,{width:c.width,height:c.height,alphaCounts:counts});}catch(e){entry.error=String(e);entry.mediaError=v.error?.code;}receipts.push(entry);result.textContent=JSON.stringify(receipts,null,2);}};
</script>
