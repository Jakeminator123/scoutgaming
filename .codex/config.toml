# Scoutgaming: Jakeminator123/scoutgaming, main.
# Work in the existing checkout; preserve random/, .env files and private lab data.
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
web_search = "live"

[sandbox_workspace_write]
network_access = true

[windows]
sandbox = "elevated"

# Existing DPAPI-protected connection; no token in configuration or output.
[mcp_servers.gitguardian]
command = "node"
args = ["tools/gitguardian-mcp.mjs"]
cwd = "C:/Users/jakob/dev/projects/scoutgame"
enabled_tools = ["read_security_status", "read_source_binding", "read_repo_incidents"]
default_tools_approval_mode = "writes"
tool_timeout_sec = 120
