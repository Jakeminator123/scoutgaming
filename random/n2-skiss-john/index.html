<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Clickable sketch of the Scout Gaming operator back office. Sample data only.">
<title>Scout Partner Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: level-1 shell (sidebar + topbar + PageHeader) reused for the operator portal, light by default. Tokens mirror lab/app/scout-theme.css. */
:root{
  --lime:#D6FF3A; --lime-hover:#C8F21F;
  --bg:#F2F1ED; --side:#FFFFFF; --surface:#FFFFFF; --surface-2:#ECEBE6; --hover:#F6F5F1;
  --border:#E0DED7; --line:#ECEAE4; --field:#FFFFFF; --field-line:#D3D1C9; --strong:#BEBCB4;
  --text:#0A0B0D; --muted:#55574F; --faint:#686A63; --accent-text:#4A6200; --on-accent:#0A0B0D; --mark:#0A0B0D;
  --live-bg:#EEFFB8; --live-text:#3E5200; --warn-bg:#FFEBCC; --warn-text:#7A4A00; --info-bg:#E3EDFF; --info-text:#1E4FA8;
  --danger-bg:#FFE3DE; --danger-text:#9A2412; --plan-bg:#ECEBE6; --plan-text:#3A3C37;
  --seg-on-bg:#0A0B0D; --seg-on-text:#F2F1ED; --strip-bg:#0A0B0D; --strip-text:#F2F1ED;
  --bar-pos:#DDF59A; --bar-neg:#FFCBC2; --bar-rl:#C9DCFF; --p-peach:#FFDDB5; --p-lilac:#E2D7FF; --p-mint:#C8EEDD; --p-btn:#E3F8A6; --p-btn-hover:#D4EF86; --grid:#E6E4DD; --shadow:0 18px 50px rgba(10,11,13,.16);
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:Inter,system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0A0B0D; --side:#0D0F12; --surface:#121418; --surface-2:#1A1E24; --hover:#15181D;
  --border:#23272E; --line:#1E2228; --field:#0D0F12; --field-line:#2A2F37; --strong:#353A43;
  --text:#F2F1ED; --muted:#A3A59F; --faint:#8A8D88; --accent-text:#D6FF3A; --mark:#D6FF3A;
  --live-bg:rgba(214,255,58,.12); --live-text:#D6FF3A; --warn-bg:rgba(255,181,71,.14); --warn-text:#FFC46B; --info-bg:rgba(120,170,255,.14); --info-text:#9DC0FF;
  --danger-bg:rgba(255,110,90,.14); --danger-text:#FF9C8A; --plan-bg:#1A1E24; --plan-text:#C9CBC5;
  --seg-on-bg:#F2F1ED; --seg-on-text:#0A0B0D; --strip-bg:#D6FF3A; --strip-text:#0A0B0D;
  --bar-pos:#DDF59A; --bar-neg:#FFCBC2; --bar-rl:#C9DCFF; --p-peach:#FFDDB5; --p-lilac:#E2D7FF; --p-mint:#C8EEDD; --p-btn:#E3F8A6; --p-btn-hover:#D4EF86; --grid:#23272E; --shadow:0 18px 50px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0B0D; --side:#0D0F12; --surface:#121418; --surface-2:#1A1E24; --hover:#15181D;
  --border:#23272E; --line:#1E2228; --field:#0D0F12; --field-line:#2A2F37; --strong:#353A43;
  --text:#F2F1ED; --muted:#A3A59F; --faint:#8A8D88; --accent-text:#D6FF3A; --mark:#D6FF3A;
  --live-bg:rgba(214,255,58,.12); --live-text:#D6FF3A; --warn-bg:rgba(255,181,71,.14); --warn-text:#FFC46B; --info-bg:rgba(120,170,255,.14); --info-text:#9DC0FF;
  --danger-bg:rgba(255,110,90,.14); --danger-text:#FF9C8A; --plan-bg:#1A1E24; --plan-text:#C9CBC5;
  --seg-on-bg:#F2F1ED; --seg-on-text:#0A0B0D; --strip-bg:#D6FF3A; --strip-text:#0A0B0D;
  --bar-pos:#DDF59A; --bar-neg:#FFCBC2; --bar-rl:#C9DCFF; --p-peach:#FFDDB5; --p-lilac:#E2D7FF; --p-mint:#C8EEDD; --p-btn:#E3F8A6; --p-btn-hover:#D4EF86; --grid:#23272E; --shadow:0 18px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--live-text);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono,.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.94em}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* Demo strip */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:6px 16px;background:var(--strip-bg);color:var(--strip-text);font-size:12px}
.strip b{font-weight:600}
.strip .sp{flex:1}
.strip select{background:transparent;border:1px solid currentColor;border-radius:4px;padding:1px 4px;font-size:12px}
.strip select option{color:#0A0B0D;background:#fff}
.strip label{display:flex;align-items:center;gap:5px}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100% - 30px)}
.side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:18px 18px 10px}
.brand .logo{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand .logo i{font-style:normal;color:var(--accent-text)}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-top:2px}
.opsel{margin:6px 12px 8px}
.opsel select{width:100%;padding:8px 10px;border:1px solid var(--field-line);background:var(--field);border-radius:8px}
.opname{margin:4px 18px 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.opname .dot{width:8px;height:8px;border-radius:50%;background:var(--bar-pos)}
nav.menu{padding:4px 8px;display:grid;gap:2px}
.grp{margin-top:8px}
.grp>button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:calc(100% - 20px);padding:6px 10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.grp>button:focus-visible{outline:2px solid var(--live-text)}
.grp>button .chev{transition:transform .15s}
.grp.closed>button .chev{transform:rotate(-90deg)}
.grp.closed .items{display:none}
.items{display:grid;gap:1px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:inset 4px 0 0 var(--p-btn-hover)}
.nav .cnt{margin-left:auto;font-size:11px;font-family:var(--f-mono);background:var(--warn-bg);color:var(--warn-text);border-radius:10px;padding:0 6px}
.side .foot{margin-top:auto;border-top:1px solid var(--border);padding:8px}
.user{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.user:hover{background:var(--hover)}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.user small{display:block;color:var(--faint);font-size:11.5px}
.umenu{position:absolute;bottom:62px;left:8px;width:260px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:40}
.umenu .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px}
.umenu .row span{color:var(--muted)}
.umenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.umenu a,.umenu button.mi{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:6px;text-decoration:none;border:0;background:none;cursor:pointer}
.umenu a:hover,.umenu button.mi:hover{background:var(--hover)}
.umenu .tag{font-family:var(--f-mono);font-size:10px;color:var(--faint);padding:4px 8px 0;letter-spacing:.1em;text-transform:uppercase}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 28px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:20}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:600}
.top .sp{flex:1}
.menubtn{display:none}
.upd{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.icon{border:1px solid var(--border);background:var(--surface);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;padding:0}
.icon:hover{background:var(--hover)}
.icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}

.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--seg-on-bg);color:var(--seg-on-text);font-weight:600}
.custom{display:flex;gap:6px;align-items:center;font-size:12px}
.custom input{padding:3px 6px;border:1px solid var(--field-line);background:var(--field);border-radius:6px}
select.sel{padding:5px 8px;border:1px solid var(--field-line);background:var(--field);border-radius:8px;font-size:12.5px}

.content{padding:24px 28px 60px;max-width:1280px;width:100%}

/* PageHeader */
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.ph .copy{min-width:0;max-width:720px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent-text);text-transform:uppercase;margin:0 0 6px}
.ph h1{font-size:30px;font-weight:600;line-height:1.1}
.ph .intro{color:var(--muted);margin:6px 0 0}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:0 0 20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--mark);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--border);background:var(--surface);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--p-btn);border-color:var(--p-btn-hover);color:#0A0B0D}
.btn.primary:hover{background:var(--p-btn-hover)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger-text);border-color:var(--danger-bg)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn:disabled{background:var(--surface-2);color:var(--faint);border-color:var(--surface-2);cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-live{background:var(--live-bg);color:var(--live-text)}
.b-paused{background:var(--warn-bg);color:var(--warn-text)}
.b-draft{background:var(--surface-2);color:var(--muted)}
.b-review{background:var(--info-bg);color:var(--info-text)}
.b-planned{background:var(--plan-bg);color:var(--plan-text)}
.b-dev{background:var(--info-bg);color:var(--info-text)}
.b-danger{background:var(--danger-bg);color:var(--danger-text)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-family:var(--f-display);font-size:24px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .d{font-size:12px;margin-top:2px;color:var(--faint)}
.up{color:var(--live-text)} .down{color:var(--danger-text)}
.kpi.warn{background:var(--warn-bg);border-color:var(--p-peach)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;min-width:0}
.card>h2{font-size:16px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card>h2 a,.card>h2 .lnk{font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--accent-text);text-decoration:none;cursor:pointer;background:none;border:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stack{display:grid;gap:14px}
.note{font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 12px;margin:0 0 14px}
.sub{color:var(--faint);font-size:12px}

.tw{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.dt th[data-a]{cursor:pointer}
.dt th[data-a]:hover{color:var(--text)}
.dt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tr.click{cursor:pointer}
.dt tr.click:hover td{background:var(--hover)}
.dt tfoot td{font-weight:600;border-top:1px solid var(--border);border-bottom:0}
.dt .muted{color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.search{padding:7px 10px;border:1px solid var(--field-line);background:var(--field);border-radius:8px;min-width:0;width:220px;max-width:100%}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--seg-on-bg);color:var(--seg-on-text);border-color:var(--seg-on-bg)}

.empty{text-align:center;padding:34px 16px;border:1px dashed var(--strong);border-radius:10px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:12px}

.actions-list{display:grid;gap:0}
.act{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}
.act:last-child{border-bottom:0}
.act .sev{width:6px;align-self:stretch;border-radius:3px;background:var(--p-peach)}
.act .sev.hi{background:var(--bar-neg)}
.act .sev.info{background:var(--bar-rl)}
.act .tx{flex:1;min-width:0}
.act .tx small{display:block;color:var(--faint);font-size:12px}
.act .go{color:var(--accent-text);font-size:12.5px;font-weight:600;white-space:nowrap}

/* Chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Live tables */
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:grid;gap:10px;min-width:0}
.tcard .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tcard h3{font-size:15px}
.tcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12.5px}
.tcard dt{color:var(--muted)} .tcard dd{margin:0;text-align:right}
.seats{display:flex;gap:4px}
.seats i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--strong)}
.seats i.f{background:var(--bar-pos);border-color:var(--bar-pos)}
.tcard .row{display:flex;gap:6px;flex-wrap:wrap}
details.det{font-size:12px;color:var(--muted)}
details.det summary{cursor:pointer}
details.det code{font-family:var(--f-mono);word-break:break-all}
.cmd{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.cmd .tcard{background:var(--surface-2)}

/* Branding */
.brandbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.brandbar .st{font-size:13px}
.brandbar .st b{font-weight:600}
.unpub{color:var(--warn-text);font-weight:600}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;align-items:start}
.form{display:grid;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.field{display:grid;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
.field input[type=text],.field input[type=email],.field input[type=number],.field input[type=url],.field input[type=date],.field select,.field textarea{padding:8px 10px;border:1px solid var(--field-line);background:var(--field);border-radius:8px;color:var(--text);width:100%;min-width:0}
.field textarea{min-height:80px;resize:vertical}
.color{display:flex;align-items:center;gap:8px;border:1px solid var(--field-line);background:var(--field);border-radius:8px;padding:4px 8px}
.color input[type=color]{width:28px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.color span{font-family:var(--f-mono);font-size:12px;color:var(--text)}
.checks{display:grid;gap:6px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check .r{margin-left:auto;font-family:var(--f-mono);font-size:12px}
.ok{color:var(--live-text)} .bad{color:var(--danger-text)}
.preview{position:sticky;top:64px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
.preview .seg{margin-bottom:10px}
.stage{position:relative;aspect-ratio:16/10;width:100%;max-width:100%;border-radius:8px;overflow:hidden}
.stage .bgimg{position:absolute;inset:0}
.stage .dealer{position:absolute;left:50%;bottom:34%;width:13%;aspect-ratio:1/1.5;transform:translateX(-50%);border-radius:50% 50% 12% 12%/40% 40% 12% 12%;background:rgba(0,0,0,.35)}
.stage .dealer::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:inherit;left:19%;top:-42%}
.stage .stageav{position:absolute;left:50%;bottom:30%;width:24%;transform:translateX(-50%)}
.stage .stageav svg{width:100%;height:auto}
.stage .dname{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:8px;white-space:nowrap}
.stage .felt{position:absolute;left:-6%;right:-6%;bottom:-62%;height:100%;border-radius:50%;border:10px solid}
.stage .print{position:absolute;left:50%;top:9%;transform:translateX(-50%);font-family:var(--f-display);font-weight:700;letter-spacing:.2em;font-size:clamp(9px,1.6vw,14px);white-space:nowrap}
.stage .arc{position:absolute;left:12%;right:12%;top:20%;height:60%;border-radius:50%;border:1.5px solid;border-bottom:0;opacity:.55}
.stage .cards{position:absolute;left:50%;top:-58%;transform:translateX(-50%);display:flex;gap:4px}
.stage .cardb{width:22px;height:31px;border-radius:3px;border:2px solid #fff}
.stage .cardf{width:22px;height:31px;border-radius:3px;background:#fff;color:#111;font:700 10px/31px var(--f-mono);text-align:center}

function chartSVG(days){
  const W=760,H=220,pl=56,pr=10,pt=12,pb=26;const games=liveGames();const COL={bj:'var(--bar-pos)',roulette:'var(--bar-rl)'};
  const ser=days.map(d=>games.map(g=>sum([d],'ggr',S.cur,g)));
  let top=0,bot=0;for(const s of ser){let p=0,n=0;for(const v of s){if(v>=0)p+=v;else n+=v}top=Math.max(top,p);bot=Math.min(bot,n)}
  top=top*1.1||1;bot=bot*1.1;const y=v=>pt+(top-v)/(top-bot)*(H-pt-pb);
  const bw=(W-pl-pr)/days.length;let g='';
  const ticks=5;for(let i=0;i<=ticks;i++){const v=bot+(top-bot)*i/ticks;const yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${pl-6}" y="${yy+3}" text-anchor="end">${nf(Math.round(v/100)*100)}</text>`}
  days.forEach((d,i)=>{const x=pl+i*bw+bw*.15;const w=Math.max(1,bw*.7);let pos=0,neg=0;
    games.forEach((gm,j)=>{const v=ser[i][j];if(!v)return;const base=v>=0?pos:neg;const y0=y(base),y1=y(base+v);if(v>=0)pos+=v;else neg+=v;
      g+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${w}" height="${Math.max(1,Math.abs(y1-y0))}" fill="${v<0?'var(--bar-neg)':COL[gm]}"><title>${df(d.iso)} · ${t('game.'+gm)}: ${nf(v)} ${showCur()}</title></rect>`});
    const every=Math.ceil(days.length/8);if(i%every===0||i===days.length-1)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${df(d.iso)}</text>`});
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--strong)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('dash.chart')}">${g}</svg><div class="legend">${games.map(gm=>`<span><i style="background:${COL[gm]}"></i>${t('game.'+gm)}</span>`).join('')}<span><i style="background:var(--bar-neg)"></i>${t('legend.neg')}</span><span>${showCur()}</span></div>`}

/* ---- Branding ---- */
const BR_FIELDS=['primary','accent','btnText','chip1','chip2','chip3','cardBack','font','shape','logo','logoImg','logoPos','logoSize','chipVals','btns','btnStyle','btnSize','layout','felt','rail','print','bg'];
function diff(a,b){return BR_FIELDS.filter(k=>JSON.stringify(a[k])!==JSON.stringify(b[k]))}
function lum(hex){const c=hex.replace('#','');const v=[0,2,4].map(i=>parseInt(c.substr(i,2),16)/255).map(x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function checks(d){const B=btnsOf(d);const out=d.btnStyle==='outline';const bc=BTN_GROUPS.map(g=>out?{k:'cb',g,l:t('btn.checkO',{b:t('btn.'+g)}),r:ratio(B[g].bg,d.felt),need:3}:{k:'cb',g,l:t('btn.check',{b:t('btn.'+g)}),r:ratio(B[g].fg,B[g].bg),need:4.5});return[...bc,{k:'c2',r:ratio(d.print,d.felt),need:3},{k:'c3',r:ratio('#FFFFFF',d.chip1),need:3}]}
const BTN_GROUPS=['main','hit','stand','dbl','ins'];
function btnsOf(d){return d.btns||{main:{bg:d.accent,fg:d.btnText},hit:{bg:d.accent,fg:d.btnText},stand:{bg:'#FFFFFF',fg:'#0A0B0D'},dbl:{bg:d.primary,fg:'#FFFFFF'},ins:{bg:'#2F6FB8',fg:'#FFFFFF'}}}
function pbtn(d,g,label,scale){const b=btnsOf(d)[g];const sz={s:[9,5,10],m:[10.5,6,12],l:[12,8,15]}[d.btnSize||'m'];const k=scale||1;const out=(d.btnStyle==='outline');
  const rad=d.shape==='square'?'4px':d.shape==='round'?'50%':'20px';const dim=d.shape==='round'?`width:${(sz[2]*3.4)*k}px;height:${(sz[2]*3.4)*k}px;padding:0;font-size:${sz[0]*.82*k}px;`:`padding:${sz[1]*k}px ${sz[2]*k}px;font-size:${sz[0]*k}px;`;
  return `<span class="pbtn" style="${dim}background:${out?'rgba(0,0,0,.25)':b.bg};color:${out?b.bg:b.fg};border-color:${b.bg};border-radius:${rad};font-family:${d.font},sans-serif">${label}</span>`}
function boardHTML(d){const rows=[['betting',[['stand',t('pb.undo')],['main',t('pb.deal')]]],['decision',[['hit',t('br.hit')],['stand',t('br.stand')],['dbl',t('pb.double')],['dbl',t('pb.split')]]],['insurance',[['ins',t('br.insure')],['stand',t('br.no')]]],['settled',[['main',t('br.rebet')]]]];
  return `<div class="board" id="btnboard" style="background:${d.felt}"><div class="field" style="color:rgba(255,255,255,.85);margin:0">${t('btn.board')}</div>${rows.map(([ph,bs])=>`<div class="r"><em>${t('br.ph.'+ph)}</em>${bs.map(([g,l])=>pbtn(d,g,l,1.15)).join('')}</div>`).join('')}</div>`}
function stageDealer(){const tb=S.tables.find(x=>x.game==='bj'&&x.status==='live'&&x.brands.includes(S.brBrand));return tb?tb.dealer:'Astrid'}
function logoPos(d){return d.logoPos||(d.logoOnTable===false?'none':'felt')}
function tableLogo(d,where){if(logoPos(d)!==where)return'';
  if(d.logoImg)return `<img class="tlogo tl-${where}" src="${d.logoImg}" alt="" style="width:${d.logoSize||24}%">`;
  return `<div class="print${where==='rail'?' onrail':''}" style="${where==='rail'?'':`color:${d.print}`}">${esc(d.logo)}</div>`}
const cornerLogo=d=>d.logoImg?`<img src="${d.logoImg}" alt="">`:esc(d.logo);

function hslHex(h,s2,l){s2/=100;l/=100;const k=n=>(n+h/30)%12,a=s2*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function hexHsl(hex){const c=hex.replace('#','');let [r,g,b]=[0,2,4].map(i=>parseInt(c.substr(i,2),16)/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s2=0;const l=(mx+mn)/2;if(mx!==mn){const dd=mx-mn;s2=l>.5?dd/(2-mx-mn):dd/(mx+mn);h=mx===r?(g-b)/dd+(g<b?6:0):mx===g?(b-r)/dd+2:(r-g)/dd+4;h*=60}return [h,s2*100,l*100]}

function palFromSeed(seed,name){let x=0;for(const ch of seed)x=(x*33+ch.charCodeAt(0))>>>0;const h=x%360;const fonts=['Montserrat','Inter','Space Grotesk','Georgia'];return palFromHues(h,hslHex((h+40)%360,82,58),name,fonts[x%4])}
function palFromLogo(url,name,done){const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=48;c.height=Math.max(1,Math.round(48*img.height/img.width));const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);let px;try{px=x.getImageData(0,0,c.width,c.height).data}catch(_){done(palFromSeed(name,name));return}
  const bins={};for(let i=0;i<px.length;i+=4){if(px[i+3]<128)continue;const [h,s2,l]=hexHsl('#'+[px[i],px[i+1],px[i+2]].map(v=>v.toString(16).padStart(2,'0')).join(''));if(l>94||l<6)continue;const k=Math.round(h/15)+'-'+Math.round(s2/25)+'-'+Math.round(l/25);bins[k]=bins[k]||{n:0,r:0,g:0,b:0};const b=bins[k];b.n++;b.r+=px[i];b.g+=px[i+1];b.b+=px[i+2]}
  const top=Object.values(bins).sort((a,b)=>b.n-a.n).slice(0,4).map(b=>'#'+[b.r,b.g,b.b].map(v=>Math.round(v/b.n).toString(16).padStart(2,'0')).join(''));
  if(!top.length){done(palFromSeed(name,name));return}
  const acc=top.slice().sort((a,b)=>hexHsl(b)[1]-hexHsl(a)[1])[0];const base=top.slice().sort((a,b)=>hexHsl(a)[2]-hexHsl(b)[2])[0];const p=palFromHues(hexHsl(base)[0],acc,name,'Inter');p.colors=top;done(p)};img.onerror=()=>done(palFromSeed(name,name));img.src=url}

  <tfoot><tr><td>${t('bmr.combined')}</td><td></td><td class="num">${money(tot,REPORT)}</td><td class="num">${money(totSt,REPORT)}</td><td class="num">${totSt?nf(tot/totSt*100,2)+' %':'—'}</td><td class="num">${nf(totRd)}</td><td>100 %</td></tr></tfoot></table></div>${t('conv',{d:df('2026-10-09')})?`<div class="sub">${t('conv',{d:df('2026-10-09')})}</div>`:''}</div>`}

/* ---- Dealer insights ---- */
function pDealers(){
  const games=liveGames().filter(g=>DEALERS[g]);if(!games.includes(S.diGame))S.diGame='bj';
  const names=(DEALERS[S.diGame]||[]).map(d=>d[0]);const days=periodDays().length;const f=Math.pow(days/30,.85);
  const rows=names.map(n=>({n,...DI[n],score:diScore(n),uniqP:Math.round(DI[n].uniq*f),hrsP:Math.round(DI[n].hrs*days)}));
  const byScore=[...rows].sort((a,b)=>b.score-a.score),byStay=[...rows].sort((a,b)=>b.stay-a.stay);
  const avgStay=rows.reduce((a,r)=>a+r.stay*r.hrsP,0)/Math.max(1,rows.reduce((a,r)=>a+r.hrsP,0));const avgRet=rows.reduce((a,r)=>a+r.ret,0)/rows.length;
  let h=PH(t('g.overview'),t('p.dealers'),t('di.intro'),canSee('dealerlib')?`<a class="btn ghost" href="#dealerlib">${t('di.all')}</a>`:'',games.length>1?TABS(S.diGame,games.map(g=>[g,t('game.'+g)]),'digame'):'');
  const X=n=>DX[n];const hrsTot=rows.reduce((a,r)=>a+r.hrsP,0)||1;const w=k=>rows.reduce((a,r)=>a+X(r.n)[k]*r.hrsP,0)/hrsTot;
  h+=`<div class="kpis">${KPI(t('di.avgStay'),`${nf(avgStay)}<small>${t('di.min')}</small>`)}${KPI(t('dx.chatPct'),nf(w('chatPct'))+' %',t('dx.chatStayK',{x:nf(w('chatX'),1)}))}${KPI(t('dx.stakesH'),`${nf(w('stakesH'))}<small>EUR</small>`)}${KPI(t('di.mostPop'),byScore[0].n,`${t('di.score')} ${byScore[0].score}`)}${KPI(t('di.return'),nf(avgRet)+' %')}</div>`;
  const mxStay=Math.max(...rows.map(r=>r.stay)),cap=S.diGame==='bj'?7:40;
  const bar=(v,mx,n,txt)=>`<span class="hbar"><span class="b" style="width:${Math.max(2,v/mx*80)}px;background:${DCOL[n]}"></span><span class="mono">${txt}</span></span>`;
  const mxOf=k=>Math.max(...rows.map(r=>X(r.n)[k]))||1;
  // audience: segment values per dealer
  const SEGS=[['hr',x=>x.tier[0]],['mid',x=>x.tier[1]],['cas',x=>x.tier[2]],['new',x=>x.newPct],['a1',x=>x.age[0]],['a2',x=>x.age[1]],['a3',x=>x.age[2]],['a4',x=>x.age[3]],['mob',x=>x.mobile],...['SE','IE','EE','INT'].map(m=>['m'+m,x=>x.mkt[m]])];
  const avgSeg=f=>rows.reduce((a,r)=>a+f(X(r.n))*r.hrsP,0)/hrsTot;
  const idx=(n,f)=>{const av=avgSeg(f);return av?f(X(n))/av:1};
  const idxTxt=v=>`<span class="mono ${v>=1.15?'up':v<=.85?'down':'sub'}">${nf(v,1)}×</span>`;
  const stack=n=>{const x=X(n);const parts=[['var(--p-peach)',x.tier[0],t('dx.s.hr')],['var(--bar-rl)',x.tier[1],t('dx.s.mid')],['var(--bar-pos)',x.tier[2],t('dx.s.cas')]];return `<div class="stackbar" style="min-width:160px">${parts.map(([c,v,l])=>`<i style="width:${v}%;background:${c}" title="${l} ${v} %"></i>`).join('')}</div>`};
  const VIEWS={
   pop:[[t('di.hours'),r=>nf(r.hrsP),1],[t('di.stay'),r=>bar(r.stay,mxStay,r.n,r.stay+' '+t('di.min'))],[t('di.occ'),r=>bar(r.occ,cap,r.n,nf(r.occ,1)+(S.diGame==='bj'?'/7':''))],[t('di.uniq'),r=>nf(r.uniqP),1],[t('di.ret'),r=>r.ret+' %',1],[t('di.trend'),r=>`<span class="${r.tr>=0?'up':'down'}">${r.tr>=0?'▲':'▼'} ${Math.abs(r.tr)} %</span>`,1],[t('di.score'),(r,i)=>`<span class="score ${i===0?'top':''}">${r.score}</span>`]],
   chat:[[t('dx.chatPct'),r=>bar(X(r.n).chatPct,mxOf('chatPct'),r.n,X(r.n).chatPct+' %')],[t('dx.mph'),r=>nf(X(r.n).mph),1],[t('dx.mpp'),r=>nf(X(r.n).mpp,1),1],[t('dx.msgs'),r=>nf(X(r.n).mph*r.hrsP),1],[t('dx.reply'),r=>X(r.n).reply+' %',1],[t('dx.pos'),r=>X(r.n).pos+' %',1],[t('dx.chatX'),r=>`<span class="up">${nf(X(r.n).chatX,1)}×</span>`,1]],
   stay:[[t('di.stay'),r=>bar(r.stay,mxStay,r.n,r.stay+' '+t('di.min'))],[t('dx.median'),r=>X(r.n).median+' '+t('di.min'),1],[t('di.ret'),r=>r.ret+' %',1],[t('dx.swap'),r=>`<span class="${X(r.n).swap>15?'down':''}">${X(r.n).swap} %</span>`,1],[t('di.occ'),r=>bar(r.occ,cap,r.n,nf(r.occ,1)+(S.diGame==='bj'?'/7':''))]],
   play:[[t('dx.stakesH'),r=>bar(X(r.n).stakesH,mxOf('stakesH'),r.n,nf(X(r.n).stakesH)+' EUR')],[t('dx.stakes'),r=>money(X(r.n).stakesH*r.hrsP,'EUR'),1],[t('dx.avgBet'),r=>money(X(r.n).avgBet,'EUR'),1],[t('dx.rph'),r=>nf(X(r.n).rph),1],[t('dx.side'),r=>S.diGame==='bj'?X(r.n).side+' %':'—',1],[t('di.ggrh'),r=>money(r.ggrh,'EUR'),1]],
   aud:[[t('dx.tiers'),r=>stack(r.n)],[t('dx.s.hr'),r=>`${X(r.n).tier[0]} % ${idxTxt(idx(r.n,x=>x.tier[0]))}`,1],[t('dx.s.new'),r=>`${X(r.n).newPct} % ${idxTxt(idx(r.n,x=>x.newPct))}`,1],[t('dx.age'),r=>{const a=X(r.n).age;const i=a.indexOf(Math.max(...a));return `${t('dx.s.a'+(i+1))} <span class="sub">${a[i]} %</span>`}],[t('bm.market'),r=>{const m=Object.entries(X(r.n).mkt).sort((a,b)=>b[1]-a[1])[0];return `${mktName(m[0])} <span class="sub">${m[1]} %</span>`}],[t('dx.s.mob'),r=>`${X(r.n).mobile} %`,1]],
   other:[[t('dx.tips'),r=>money(X(r.n).tips,'EUR'),1],[t('dx.lang'),r=>X(r.n).lang+' %',1],[t('dx.newPct'),r=>X(r.n).newPct+' %',1],[t('dx.reports'),r=>`<span class="${X(r.n).reports>1?'down':''}">${X(r.n).reports}</span>`,1]]};
  const cols=VIEWS[S.diView]||VIEWS.pop;
  h+=`<div class="card"><h2>${t('di.table')} <div class="seg">${['pop','chat','stay','play','aud','other'].map(k=>`<button data-a="diview" data-v="${k}" aria-pressed="${S.diView===k}">${t('dx.v.'+k)}</button>`).join('')}</div></h2><p class="note" style="margin-top:-4px">${t('dx.h.'+S.diView)}</p><div class="tw"><table class="dt"><thead><tr><th>${t('br.dealer')}</th><th>${t('br.langs')}</th>${cols.map(c=>`<th class="${c[2]?'num':''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${byScore.map((r,i)=>`<tr class="click" data-a="difans" data-v="${r.n}" tabindex="0"><td><span class="dname-cell">${avatar(r.n,28)}<b>${r.n}</b></span></td><td class="muted">${DEALERS[S.diGame].find(d=>d[0]===r.n)[1]}</td>${cols.map(c=>`<td class="${c[2]?'num':''}">${c[1](r,i)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${S.diView==='aud'?`<div class="legend"><span><i style="background:var(--p-peach)"></i>${t('dx.s.hr')}</span><span><i style="background:var(--bar-rl)"></i>${t('dx.s.mid')}</span><span><i style="background:var(--bar-pos)"></i>${t('dx.s.cas')}</span><span class="sub">${t('dx.idxNote')}</span></div>`:''}</div>`;
  if(S.diView==='aud'&&rows.length>1){
    const segList=[['hr',x=>x.tier[0]],['cas',x=>x.tier[2]],['new',x=>x.newPct],['a1',x=>x.age[0]],['a4',x=>x.age[3]],['mob',x=>x.mobile],...['SE','IE','EE','INT'].map(m=>['m'+m,x=>x.mkt[m]])];
    h+=`<div class="card" style="margin-top:14px"><h2>${t('dx.best')}</h2><p class="note" style="margin-top:-4px">${t('dx.bestB')}</p><div class="tw"><table class="dt"><thead><tr><th>${t('dx.segment')}</th><th>${t('dx.bestDealer')}</th><th class="num">${t('dx.index')}</th><th>${t('dx.runnerUp')}</th></tr></thead><tbody>${segList.map(([k,f])=>{const ranked=rows.map(r=>({n:r.n,i:idx(r.n,f)})).sort((a,b)=>b.i-a.i);return `<tr><td><b>${k[0]==='m'&&k!=='mob'?mktName(k.slice(1)):t('dx.s.'+k)}</b></td><td><span class="bdot" style="background:${DCOL[ranked[0].n]}"></span> <b>${ranked[0].n}</b></td><td class="num">${idxTxt(ranked[0].i)}</td><td class="sub">${ranked[1].n} ${nf(ranked[1].i,1)}×</td></tr>`}).join('')}</tbody></table></div><p class="sub" style="margin:8px 0 0">${t('dx.audPriv')}</p></div>`}
  const mxS=Math.max(...rows.map(r=>{const x=X(r.n),p=x.chatPct/100,sn=r.stay/(p*x.chatX+1-p);return sn*x.chatX}));
  if(S.diView==='chat'||S.diView==='pop')h+=`<div class="card" style="margin-top:14px"><h2>${t('dx.chatVs')}</h2><p class="note" style="margin-top:-4px">${t('dx.chatVsB')}</p><div class="tw"><table class="dt"><tbody>${rows.map(r=>{const x=X(r.n),p=x.chatPct/100,sn=r.stay/(p*x.chatX+1-p),sc=sn*x.chatX;return `<tr><td style="width:90px"><b>${r.n}</b></td><td><div style="display:grid;gap:4px"><span class="hbar"><span class="b" style="width:${sc/mxS*260}px;background:${DCOL[r.n]}"></span><span class="mono">${nf(sc)} ${t('di.min')} · ${t('dx.chatting')}</span></span><span class="hbar"><span class="b" style="width:${sn/mxS*260}px;background:var(--surface-2);border:1px solid var(--strong)"></span><span class="mono sub">${nf(sn)} ${t('di.min')} · ${t('dx.notChatting')}</span></span></div></td></tr>`}).join('')}</tbody></table></div><p class="sub" style="margin:8px 0 0">${t('dx.privacy')}</p></div>`;
  const mxSlot=Math.max(...rows.flatMap(r=>r.slots));
  h+=`<div class="grid2" style="margin-top:14px"><div class="card"><h2>${t('di.slots')}</h2><p class="note" style="margin-top:-4px">${t('di.slotsB')}</p><div class="tw"><table class="dt heat"><thead><tr><th></th>${[1,2,3,4].map(i=>`<th style="text-align:center">${t('di.s'+i)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.n}</b></td>${r.slots.map(v=>`<td class="h" style="background:color-mix(in srgb, var(--bar-pos) ${Math.round(v/mxSlot*100)}%, var(--surface))">${nf(v,1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  const recs=S.diGame==='bj'?[
    {title:t('di.rec1',{d:'Astrid',tb:'Aurora Blackjack 2'}),body:t('di.rec1b',{d:'Astrid',p:38}),tb:'bj2',d:'Astrid',at:`${TODAY}T18:00`},
    {title:t('di.rec2',{d:'Amira'}),body:t('di.rec2b',{tb:'Aurora Blackjack 1'}),tb:'bj1',d:'Amira',at:'2026-10-11T00:00'},
    {title:t('di.rec3',{n:14,d:'Astrid'}),body:t('di.rec3b',{p:27,d:'Astrid',tb:'Aurora Blackjack 1'}),tb:null}]
   :[{title:t('di.rec3',{n:9,d:'Vera'}),body:t('di.rec3b',{p:22,d:'Vera',tb:'Aurora Roulette'}),tb:null}];
  h+=`<div class="card"><h2>${t('di.recs')}</h2><div class="recs">${recs.map(r=>`<div class="rec"><span class="tx"><b>${r.title}</b><small>${r.body}</small></span>${r.tb&&can('tableops')?`<button class="btn sm" data-a="recsched" data-v="${r.tb}" data-d="${r.d}" data-t="${r.at}">${t('di.schedule')}</button>`:''}</div>`).join('')}</div><p class="sub" style="margin:8px 0 0">${t('di.rgNote')}</p></div></div>`;
  if(S.diGame==='bj'){
    let pl=S.players.filter(p=>!['flagged','blocked','selfex'].includes(p.status)).map(p=>({p,a:affinity(p.ref)}));
    if(S.diDealer)pl=pl.filter(o=>o.a.fav===S.diDealer);
    h+=`<div class="card" style="margin-top:14px"><h2>${S.diDealer?t('di.fansOf',{d:S.diDealer}):t('di.match')} <select class="sel" id="di-dealer" data-c="didealer"><option value="">${t('di.allDealers')}</option>${names.map(n=>`<option${S.diDealer===n?' selected':''}>${n}</option>`).join('')}</select></h2><p class="note" style="margin-top:-4px">${t('di.matchB')}</p>
    <div class="tw"><table class="dt"><thead><tr><th>${t('pl.player')}</th><th>${t('pl.brand')}</th><th>${t('di.fav')}</th><th style="min-width:180px">${t('di.matchB').split(',')[0]}</th><th class="num">${t('di.longer')}</th></tr></thead><tbody>${pl.map(({p,a})=>`<tr class="click" data-a="openpl" data-v="${p.ref}" tabindex="0"><td class="mono"><b>${p.ref}</b>${p.seg==='vip'?' <span class="badge b-review">VIP</span>':''}</td><td>${p.brand}</td><td><b>${a.fav}</b></td><td><div class="stackbar">${a.sh.map(([n,v])=>`<i style="width:${v*100}%;background:${DCOL[n]}" title="${n} ${Math.round(v*100)} %"></i>`).join('')}</div></td><td class="num up">+${a.longer} %</td></tr>`).join('')}</tbody></table></div>
    <div class="legend">${names.map(n=>`<span><i style="background:${DCOL[n]}"></i>${n}</span>`).join('')}</div></div>`}
  return h}

   <div class="tw"><table class="dt"><thead><tr><th>${t('pl.cur')}</th><th>${t('games.min')}</th><th>${t('games.max')}</th></tr></thead><tbody>${CURS.map(c=>`<tr><td class="mono">${c}</td><td><input class="search" style="width:110px" type="number" step="any" id="te-${c}-0" value="${l[c][0]}"></td><td><input class="search" style="width:120px" type="number" step="any" id="te-${c}-1" value="${l[c][1]}"></td></tr>`).join('')}</tbody></table></div><p class="sub" style="margin:0">${t('ops.range',{a:nf(rg[0],rg[0]<1?1:0),b:nf(rg[1]),g:t('game.'+x.game)})}</p></section>

function statements(){

    const days=DAYS.filter(d=>d.m===m);const rate=MRATE[m];const per={};let tot=0;
    for(const k of CURS){const v=days.reduce((a,d)=>a+val(d,k,'ggr','all'),0);per[k]=v;tot+=v/rate[k]}
    const dim=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),0)).getUTCDate();
    const fees=[];for(const tb of TABLES0.filter(x=>x.from&&(x.game!=='roulette'||rlOn()))){const start=tb.from>m+'-01'?+tb.from.slice(8):1;if(tb.from.slice(0,7)>m)continue;const endDay=m==='2026-10'?10:dim;const act=Math.max(0,endDay-start+1);if(!act)continue;fees.push({name:tb.name,act,dim,fee:(tb.game==='roulette'?2500:3000)*act/dim})}

function tVal(id,days,field,cur){let s=0;for(const d of days){if(id==='rl1')s+=sum([d],field,cur,'roulette');else s+=sum([d],field,cur,'bj')*(tableShare(d.iso)[id]||0)}return s}
function prevDays(days){const i=DAYS.findIndex(d=>d.iso===days[0].iso);return DAYS.slice(Math.max(0,i-days.length),i)}
function miniBars(vals,labels,cur){const W=420,H=120,pl=46,pt=6,pb=18;const top=Math.max(0,...vals)*1.1||1,bot=Math.min(0,...vals)*1.1;const y=v=>pt+(top-v)/(top-bot)*(H-pt-pb);const bw=(W-pl-4)/Math.max(1,vals.length);let g='';
  [bot,0,top].forEach(v=>{g+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${nf(Math.round(v))}</text>`});
  vals.forEach((v,i)=>{const x=pl+i*bw+bw*.12,w=Math.max(1,bw*.76);g+=`<rect x="${x}" y="${Math.min(y(0),y(v))}" width="${w}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" fill="${v<0?'var(--bar-neg)':'var(--bar-pos)'}"><title>${labels[i]}: ${nf(v)} ${cur}</title></rect>`;const ev=Math.ceil(vals.length/6);if(i%ev===0)g+=`<text x="${x+w/2}" y="${H-4}" text-anchor="middle">${labels[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`}

  case 'brf':{const k=el.dataset.k;B.draft[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;render();break}
  case 'tier':{if(!UI.tierDraft)UI.tierDraft=JSON.parse(JSON.stringify(S.tiers));UI.tierDraft[+el.dataset.i].lim[el.dataset.cur][+el.dataset.k]=+el.value;const b=document.querySelector('[data-a=savetiers]');if(b){b.disabled=false;b.classList.add('primary')}break}
  case 'mrole':{const m=S.team[+el.dataset.i];const old=m.role;if(old==='owner'&&el.value!=='owner'&&S.team.filter(x=>x.role==='owner'&&x.status==='active').length<=1){toast(t('team.lastOwner'));render();break}m.role=el.value;audit('team','Changed role',m.email,`${t('role.'+old)} → ${t('role.'+m.role)}`);render();toast(t('team.roleDone'));break}
  case 'deftype':UI.defDraft={...(UI.defDraft||S.defLimit),type:el.value};break;
  case 'defv':UI.defDraft={...(UI.defDraft||S.defLimit),v:el.value};break;
  case 'txgame':S.txGame=el.value;render();break;
  case 'txtable':S.txTable=el.value;render();break;
  case 'auduser':S.audUser=el.value;render();break;
  case 'audtype':S.audType=el.value;render();break;
  case 'wallet':S.wallet[S.intEnv]=el.value;save();break;
  case 'ips':S.ips=el.value;save();break;
  }});
document.addEventListener('input',e=>{const el=e.target,c=el.dataset.c;if(!c)return;
  if(c==='btnc'){const d=S.brands[S.brBrand].draft;const B=JSON.parse(JSON.stringify(btnsOf(d)));B[el.dataset.g][el.dataset.p]=el.value;d.btns=B;const w=document.getElementById('stagewrap');if(w)w.innerHTML=UI.route==='setup'?stage(d):pickStage(d);const bb=document.getElementById('btnboard');if(bb)bb.outerHTML=boardHTML(d)}
  if(c==='brf'&&(el.type==='color'||el.type==='range')){const B=S.brands[S.brBrand];B.draft[el.dataset.k]=el.type==='range'?+el.value:el.value;el.nextElementSibling.textContent=el.type==='range'?el.value+' %':el.value.toUpperCase();const w=document.getElementById('stagewrap');if(w)w.innerHTML=UI.route==='setup'?stage(B.draft):pickStage(B.draft)}
  if(c==='plq'||c==='txq'||c==='dlq'){S[c==='plq'?'plQ':c==='txq'?'txQ':'dlQ']=el.value;const pos=el.selectionStart;render();const n=document.getElementById(el.id);if(n){n.focus();n.setSelectionRange(pos,pos)}}});
window.addEventListener('hashchange',()=>{route();if(UI.panel&&typeof UI.panel!=='function')closeAll();render();document.getElementById('side').classList.remove('open');window.scrollTo(0,0)});

function addTablePanel(){return `<div class="hd"><div><p class="eyebrow">// ${t('game.'+S.gamesTab)}</p><h2>${t('games.addTitle')}</h2></div><button class="icon" data-a="close" aria-label="${t('c.close')}">${ICON.close}</button></div>
 <div class="bd"><label class="field">${t('games.name')}<input type="text" id="nt-name" placeholder="Aurora Blackjack 3"></label>
 <label class="field">${t('games.tierSel')}<select id="nt-tier">${S.tiers.filter(x=>(x.game||'bj')===S.gamesTab).map(x=>`<option value="${x.id}">${x.name} · ${nf(x.lim.EUR[0])}–${nf(x.lim.EUR[1])} EUR</option>`).join('')}</select></label>
 <fieldset class="field" style="border:0;padding:0;margin:0"><legend style="margin-bottom:5px">${t('games.brands')}</legend>${Object.keys(S.brands).map(b=>`<label class="check"><input type="checkbox" name="nt-brand" value="${b}" ${b==='Nordic Spins'?'checked':''}> ${b}</label>`).join('')}</fieldset>
 ${S.gamesTab==='bj'?`<fieldset class="field" style="border:0;padding:0;margin:0"><legend style="margin-bottom:5px">${t('games.sidebets')}</legend>${['21+3','Perfect Pairs'].map(b=>`<label class="check"><input type="checkbox" name="nt-side" value="${b}"> ${b}</label>`).join('')}</fieldset>`:''}
 <div class="fgrid"><label class="field">${t('rm.profile')}<select id="nt-prof">${Object.keys(S.brands).map(b=>`<option>${b.toLowerCase().replace(/ /g,'-')}-${S.gamesTab==='bj'?'classic':'roulette'}</option>`).join('')}</select></label><label class="field">${t('rm.lane')}<input type="text" value="${S.gamesTab==='bj'?'blackjack-local':'roulette-local'}" disabled></label></div>
 <p class="hint" style="margin:0">${t('rm.atomic')} ${t('lk.newTable')}</p></div>
 <div class="ft"><button class="btn" data-a="close">${t('c.cancel')}</button><button class="btn primary" data-a="createtable">${t('games.create')}</button></div>`}
function historyPanel(){const B=S.brands[S.brBrand];return `<div class="hd"><div><p class="eyebrow">// ${S.brBrand}</p><h2>${t('br.history')}</h2></div><button class="icon" data-a="close" aria-label="${t('c.close')}">${ICON.close}</button></div>
 <div class="bd"><table class="dt"><tbody>${B.versions.slice(0,10).map((x,i)=>`<tr><td class="mono"><b>v${x.v}</b></td><td>${df(x.at)}<div class="sub">${x.by}</div></td><td>${i===0?`<span class="badge b-live">${t('br.current')}</span>`:can('publish')?`<button class="btn sm" data-a="restore" data-v="${x.v}">${t('br.restore')}</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function requestPanel(type){return `<div class="hd"><div><p class="eyebrow">// ${t('p.branding')}</p><h2>${t('req.title')}</h2></div><button class="icon" data-a="close" aria-label="${t('c.close')}">${ICON.close}</button></div>
 <div class="bd"><label class="field">${t('req.type')}<select id="rq-type"><option value="bg"${type==='bg'?' selected':''}>${t('req.bg')}</option><option value="dealer"${type==='dealer'?' selected':''}>${t('req.dealer')}</option></select></label>
 <label class="field">${t('req.desc')}<textarea id="rq-desc" placeholder="${t('req.descPh')}"></textarea></label>
 <label class="field">${t('req.file')}<input type="file" id="rq-file"></label>
 <label class="field">${t('req.date')}<input type="date" id="rq-date" value="2026-12-01" min="${TODAY}"></label>
 <div class="steps">${['requested','inprod','ready','live'].map((s,i)=>`<span class="${i===0?'on':''}">${t('st.'+s)}</span>`).join('')}</div></div>
 <div class="ft"><button class="btn" data-a="close">${t('c.cancel')}</button><button class="btn primary" data-a="sendreq">${t('req.send')}</button></div>`}
function invitePanel(){return `<div class="hd"><div><p class="eyebrow">// ${t('p.team')}</p><h2>${t('team.invite')}</h2></div><button class="icon" data-a="close" aria-label="${t('c.close')}">${ICON.close}</button></div>
 <div class="bd"><label class="field">${t('team.email')}<input type="email" id="iv-email" placeholder="name@nordicspins.com"></label>
 <label class="field">${t('team.role')}<select id="iv-role">${Object.keys(ROLE_VIEWS).map(r=>`<option value="${r}"${r==='readonly'?' selected':''}>${t('role.'+r)}</option>`).join('')}</select></label>
 <div class="tw"><table class="dt"><tbody>${[['owner','owner'],['pitboss','pit'],['finance','fin'],['branding','br'],['readonly','ro']].map(([r,k])=>`<tr><td><b>${t('role.'+r)}</b></td><td class="sub">${t('rs.'+k+'C')}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="ft"><button class="btn" data-a="close">${t('c.cancel')}</button><button class="btn primary" data-a="sendinvite">${t('team.invite')}</button></div>`}
function tfaModal(step){const steps=`<div class="steps">${[1,2,3].map(i=>`<span class="${i===step||(step===2&&i===1)?'on':''}">${t('tfa.s'+i)}</span>`).join('')}</div>`;
  if(step===1)openModal({title:t('tfa.title'),body:`${steps}<p style="margin:0">${t('tfa.scan')}</p><div class="qr" aria-hidden="true"></div><p class="mono sub" style="margin:0">JBSW Y3DP EHPK 3PXP</p><label class="field">${t('tfa.code')}<input type="text" id="tfa-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label>`,ok:t('tfa.verify'),onOk:()=>{const c=document.getElementById('tfa-code').value.trim();if(!/^\d{6}$/.test(c)){toast(t('tfa.bad'));return false}tfaModal(3);return false}});
  else openModal({title:t('tfa.title'),body:`<div class="steps">${[1,2,3].map(i=>`<span class="${i===3?'on':''}">${t('tfa.s'+i)}</span>`).join('')}</div><p style="margin:0">${t('tfa.rec')}</p><div class="secret" style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px">${['4k7q-9xmd','p2rw-7bnc','h8ty-3vzl','m5gs-1ckj','w9dn-6qpa','e3hu-8rxf'].map(c=>`<span>${c}</span>`).join('')}</div>`,ok:t('tfa.finish'),noCancel:true,onOk:()=>{S.twofa=true;const me=S.team.find(m=>m.me);me.tfa=true;audit('team','Turned on 2FA',me.email,'');closeAll();render();toast(t('tfa.done'))}})}

route();render();
</script>
</body>
