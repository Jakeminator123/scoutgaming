<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoutgaming · Admin och Partnerportalen · målbild (skiss)</title>
<style>
:root{color-scheme:light;--paper:#f4f4ef;--panel:#fff;--ink:#171c1a;--muted:#667068;--line:#dfe3da;--soft:#eef1e9;--lime:#d6ff3a;--lime-ink:#24300c;--accent:#506324;--green:#216342;--green-bg:#e9f5e9;--warn:#77500a;--warn-bg:#fff4dc;--red:#a02b29;--red-bg:#fff0ec;--blue:#1d4f91;--blue-bg:#e8f0fb;--sidebar:#19221d;--ui:Inter,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--ui)}
button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.5}
a{color:var(--accent)}:focus-visible{outline:3px solid #719b20;outline-offset:2px}
h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1.1px;font-weight:650;line-height:1.2}h2{font-size:17px;font-weight:650;letter-spacing:-.4px}h3{font-size:15px;font-weight:650}
.muted{color:var(--muted)}.tiny{font-size:12px}.sm{font-size:13px}
.demo{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:10px 24px;background:#e7ecdc;border-bottom:1px solid #d3dbc6;font-size:12px}
.demo label{display:inline-flex;align-items:center;gap:8px;font-weight:600}.demo select{min-height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}
.layout{display:flex;flex-wrap:wrap;min-height:calc(100vh - 54px)}
.side{flex:1 1 248px;background:var(--sidebar);color:#c9d3c4;padding:24px 14px;display:flex;flex-direction:column;gap:20px}
.side.n1{background:#141c17}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px}.brand svg{color:var(--lime)}
.wordmark{font-weight:650;font-size:19px;letter-spacing:-1px;color:#f4f7ef;line-height:1.1}.wordmark b{color:var(--lime);font-weight:650}
.scope{background:#27312a;border:1px solid #3a453b;border-radius:10px;padding:12px}.scope strong{color:#f4f7ef;display:block}
.nav{display:flex;flex-direction:column;gap:2px}.nav-title{font-size:11px;font-weight:600;color:#a6b39f;padding:0 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#c9d3c4;text-align:left;font-size:13px;font-weight:500}
.nav button:hover{background:#28352b;color:#f0f5e8}.nav button.active{background:var(--lime);color:var(--lime-ink);font-weight:650}
.nav .badge{margin-left:auto;font-size:10px;border:1px solid #6079287a;padding:1px 5px;border-radius:4px}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #3a453b;border-radius:10px;background:#222c25;font-size:12px}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
main{flex:999 1 560px;min-width:0;padding:32px 40px 64px}.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.level{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
.level.n1{background:#141c17;color:var(--lime)}.level.n2{background:var(--blue-bg);color:var(--blue)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}.pad{padding:20px 22px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.between{justify-content:space-between}.col{display:flex;flex-direction:column;gap:6px}
.list>div{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 22px;border-top:1px solid var(--soft)}.list>div:first-child{border-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.btn{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--soft)}.btn.primary{background:var(--lime);border-color:var(--lime);color:#1a2606}.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}.btn.small{min-height:36px;padding:0 12px;font-size:12px}.btn.danger{color:var(--red)}.btn.dark{background:var(--sidebar);color:#f4f7ef;border-color:var(--sidebar)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--soft);color:#3f4a43}
.tag.good{background:var(--green-bg);color:var(--green)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.red{background:var(--red-bg);color:var(--red)}.tag.blue{background:var(--blue-bg);color:var(--blue)}.tag.lock{background:#fff;border:1px solid var(--line)}
.notice{padding:12px 15px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:13px;color:#3f4a43}.notice.warn{background:var(--warn-bg);color:var(--warn);border-color:#e5c98c}.notice.blue{background:var(--blue-bg);color:var(--blue);border-color:#c3d6f1}.notice.red{background:var(--red-bg);color:var(--red);border-color:#e6b6ad}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}.tabs button{min-height:44px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;font-weight:500;font-size:13px;color:var(--muted);margin-bottom:-1px}.tabs button.active{color:var(--ink);font-weight:650;border-bottom-color:var(--ink)}
.opt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt button{padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left}.opt button.on{border:2px solid var(--accent);background:#f6f9ee;padding:8px}.opt .sw{display:block;height:44px;border-radius:6px}.opt .lb{display:block;padding-top:6px;font-weight:600;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}.field select,.field input{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:400}
.chk{display:flex;align-items:center;gap:12px;min-height:44px}.chk input{width:18px;height:18px}
.scene{position:relative;height:260px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.scene .lbl{position:absolute;top:12px;left:14px;font-size:11px;font-weight:600;color:#f4f7ef;background:#00000059;padding:3px 8px;border-radius:5px}
.scene .dealer{width:110px;height:140px;border-radius:55px 55px 12px 12px;background:#c9cfc4;display:grid;place-items:center;font-size:11px;font-weight:600;color:#2b332e;margin-bottom:-20px}
.scene .table{width:92%;height:100px;border-radius:50% 50% 0 0/70% 70% 0 0;display:grid;place-items:center;font-size:11px;font-weight:600;color:#f4f7ef}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--sidebar);color:#f4f7ef;padding:12px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:20}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.chips button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px}.chips button.on{background:var(--sidebar);border-color:var(--sidebar);color:#f4f7ef}.chips button.dash{border-style:dashed;background:transparent;color:#3f4a43}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:13px}.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.stat{display:flex;flex-direction:column;gap:4px}.stat b{font-size:22px;letter-spacing:-.6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.cards>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
ol.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}ol.steps li{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;background:#fff}
@media (max-width:720px){main{padding:20px 16px 48px}.opt{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="demo" role="region" aria-label="Demoinställningar">
  <span><strong>Skiss · Admin (nivå 1) och Partnerportalen (nivå 2).</strong> Exempeldata i minnet, ingen server. Det du tilldelar i nivå 1 syns i nivå 2. Målbilden i text är docs/plans/ADMIN-FORENKLING.md; koden på main vinner alltid.</span>
  <span class="row">
    <label>Visa <select id="who"><option value="n1">Nivå 1 · Scout Gaming</option><option value="n2-admin">Nivå 2 · Johns Bet · administratör</option><option value="n2-editor">Nivå 2 · Johns Bet · redaktör</option><option value="n2-viewer">Nivå 2 · Johns Bet · läsare</option></select></label>
    <button class="btn small" id="reset">Återställ</button>
  </span>
</div>
<div id="app"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x));const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

// ===== Delad data. Nivå 1 äger katalogen; nivå 2 ser bara sin publicerade tilldelning. =====
const OPS={john:{name:'Johns Bet',initials:'JB'},demo:{name:'Demooperatör',initials:'DO'}};
const CATALOG={
  games:[{id:'Blackjack'},{id:'Roulette'}],
  dealers:[
    {id:'paow',name:'PAOW',game:'Blackjack',langs:['Svenska','Engelska'],clips:{vila:'Klart',handlingar:'Klart',repliker:'Saknar Resultat'}},
    {id:'astrid',name:'Astrid',game:'Blackjack',langs:['Svenska'],clips:{vila:'Klart',handlingar:'Klart',repliker:'Klart'}},
    {id:'viktor',name:'Viktor',game:'Roulette',langs:['Engelska'],clips:{vila:'Klart',handlingar:'Saknas',repliker:'Saknas'}}
  ],
  scenes:[{id:'bj3',name:'Blackjack, tre lager'}],
  tableAssets:[{id:'Oak',fill:'#8a5a32'},{id:'Obsidian',fill:'#3b434a'}],
  backgrounds:[{id:'Midnight',fill:'#1f3a2c'},{id:'Velvet',fill:'#5a3a2e'}]
};
const ALLOW_LBL={dealer:'Välja dealer bland tilldelade',tableAsset:'Välja bordsgrafik',background:'Välja bakgrund',language:'Ändra bordsspråk',limit:'Ändra insatsprofil',pause:'Pausa egna spelbord'};
let records,assign,team,invites,journal,approved,state;
function mkTable(id,op,name,published,cfg){const live={dealer:'paow',tableAsset:'Oak',background:'Midnight',language:'Svenska',limit:'Standard',open:true,...cfg};
  return{id,op,name,published,version:published?12:0,live,saved:clone(live),working:clone(live),history:published?[{v:12,text:'Bakgrund och bordsgrafik',who:'Redaktör B'},{v:11,text:'Dealer tilldelad',who:'Scout Gaming'}]:[]};}
function mkAssign(version,pub){return{version,published:pub,working:clone(pub)};}
function resetData(){
  approved={paow:true,astrid:true,viktor:false};
  assign={
    john:mkAssign(4,{games:['Blackjack'],dealers:['paow','astrid'],scenes:['bj3'],tableAssets:['Oak','Obsidian'],backgrounds:['Midnight','Velvet'],allow:{dealer:true,tableAsset:true,background:true,language:true,limit:false,pause:true}}),
    demo:mkAssign(2,{games:['Blackjack'],dealers:['astrid'],scenes:['bj3'],tableAssets:['Oak'],backgrounds:['Velvet'],allow:{dealer:false,tableAsset:true,background:false,language:false,limit:false,pause:true}})
  };
  records={'bj-paow':mkTable('bj-paow','john','PAOW Blackjack',true),'bj-prive':mkTable('bj-prive','john','PAOW Privé',false,{background:'Velvet',open:false}),'demo-bj':mkTable('demo-bj','demo','Demobord',true,{dealer:'astrid',background:'Velvet'})};
  team={john:[{id:1,name:'Administratör A',role:'admin',status:'Aktiv',last:true},{id:2,name:'Redaktör B',role:'editor',status:'Aktiv'},{id:3,name:'Läsare C',role:'viewer',status:'Aktiv'}],demo:[{id:4,name:'Administratör D',role:'admin',status:'Aktiv',last:true}]};
  invites={john:[{email:'[e-postadress]',role:'editor',sent:'[datum]'}],demo:[]};
  journal={john:[{t:'[datum]',text:'Redaktör B publicerade PAOW Blackjack, version 12.'},{t:'[datum]',text:'Scout Gaming publicerade tilldelning version 4: Astrid tillagd.'},{t:'[datum]',text:'Administratör A bjöd in en redaktör.'}],demo:[{t:'[datum]',text:'Scout Gaming pausade Demobord.'}]};
  state={level:'n1',role:'admin',page:'overview',op:'john',filter:'alla',table:null,tab:'look',review:false,toast:'',invite:false,material:false,dealer:'paow',dtab:'klipp',otab:'assign',stab:'drift',delChecked:false,talpar:{a:'Väntar',b:'Väntar',c:'Godkänt'}};
}
resetData();

// ===== Nivå och behörighet =====
const isN1=()=>state.level==='n1';
const PERMS={
  admin:['tables.read','tables.write','tables.publish','tables.pause','dealers.read','players.read','players.block','reports.read','team.read','team.invite','team.roles.assign','team.suspend','integration.read','integration.request','material.request'],
  editor:['tables.read','tables.write','tables.publish','tables.pause','dealers.read','reports.read','integration.read','material.request'],
  viewer:['tables.read','dealers.read','reports.read']
};
const ROLE_NAME={admin:'Administratör',editor:'Redaktör',viewer:'Läsare'};
const can=p=>isN1()||PERMS[state.role].includes(p);
const readOnly=()=>!can('tables.write');
const curOp=()=>isN1()?state.op:'john';
const pkg=op=>assign[op].published;          // det operatören ser
const pkgWork=op=>assign[op].working;        // det Scout redigerar
const pkgDirty=op=>!eq(assign[op].working,assign[op].published);
const dealer=id=>CATALOG.dealers.find(d=>d.id===id)||{name:id};
const fill=(list,id)=>(list.find(x=>x.id===id)||{}).fill||'#333';
const table=()=>records[state.table];
const dirty=r=>!eq(r.working,r.saved);const draft=r=>!eq(r.saved,r.live)||!r.published;
const tablesOf=op=>Object.values(records).filter(r=>r.op===op);
let toastTimer;function toast(t){state.toast=t;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast='';render();},4500);}
function go(page){const unsaved=Object.values(records).filter(dirty);if(unsaved.length&&!confirm('Du har osparade ändringar. Lämna ändå? Sparade utkast ligger kvar.'))return;unsaved.forEach(r=>r.working=clone(r.saved));state.page=page;state.table=null;state.review=false;state.material=false;render();window.scrollTo(0,0);}

// ===== Sidomeny =====
function side(){
  const item=(id,label,perm,badge)=>!perm||can(perm)?`<button data-go="${id}" class="${state.page===id?'active':''}">${label}${badge!==undefined?`<span class="badge">${badge}</span>`:''}</button>`:'';
  const brand=`<div class="brand"><svg width="28" height="28" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M8 22V8H22M78 8H92V22M92 78V92H78M22 92H8V78" stroke="currentColor" stroke-width="8" stroke-linecap="square"/><path d="M68 36C68 28 60 24 50 24C40 24 32 28 32 36C32 50 68 50 68 64C68 72 60 76 50 76C40 76 32 72 32 64" stroke="currentColor" stroke-width="9.5" stroke-linecap="square"/></svg>
    <div><div class="wordmark">scout<b>/</b>gaming</div><div class="tiny" style="color:#a6b39f;margin-top:4px">${isN1()?'Scout Admin, nivå 1':'Operatörsportal, nivå 2'}</div></div></div>`;
  if(isN1())return `<aside class="side n1" aria-label="Huvudmeny">${brand}
    <div class="scope"><span class="tiny" style="color:#a6b39f">Scout Gaming</span><strong>Alla operatörer</strong><span class="tiny">Skapa, tilldela, publicera</span></div>
    <nav class="nav">${item('overview','Översikt')}${item('tables','Spelbord',null,Object.keys(records).length)}${item('operators','Operatörer',null,Object.keys(OPS).length)}</nav>
    <div><p class="nav-title">Innehåll</p><nav class="nav">${item('dealers','Dealers')}${item('scenes','Scenmallar')}${item('material','Material')}</nav></div>
    <div><p class="nav-title">Scout</p><nav class="nav">${item('system','System')}${item('help','Hjälp')}</nav></div>
    <div class="user"><span class="avatar">SG</span><span><span style="color:#f4f7ef;font-weight:600;display:block">Scout-personal</span><span style="color:#a6b39f">Administratör, exempel</span></span></div></aside>`;
  return `<aside class="side" aria-label="Huvudmeny">${brand}
    <div class="scope"><span class="tiny" style="color:#a6b39f">Din operatör</span><strong>Johns Bet</strong><span class="tiny">Tilldelning version ${assign.john.version}</span></div>
    <div><p class="nav-title">Ert casino</p><nav class="nav">${item('overview','Översikt')}${item('tables','Spelbord',null,tablesOf('john').length)}${item('dealers','Dealers','dealers.read')}${item('players','Spelare','players.read')}${item('reports','Rapporter','reports.read')}</nav></div>
    <div><p class="nav-title">Bolaget</p><nav class="nav">${item('team','Team','team.read')}${item('integration','Integration','integration.read')}${item('help','Hjälp och kontakt')}</nav></div>
    <div class="user"><span class="avatar">JB</span><span><span style="color:#f4f7ef;font-weight:600;display:block">${ROLE_NAME[state.role]}</span><span style="color:#a6b39f">Johns Bet, exempel</span></span></div></aside>`;
}
const levelPill=()=>isN1()?`<span class="level n1">Nivå 1 · Scout Gaming · ser och styr allt</span>`:`<span class="level n2">Nivå 2 · Johns Bet · bara eget bolag, inom tilldelningen</span>`;
const header=(title,sub,actions='')=>`<div class="head"><div class="col"><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>${actions}</div>`;
const status=r=>r.published?(draft(r)?`<span class="tag warn">Utkast ovanpå v${r.version}</span>`:`<span class="tag good">Publicerad v${r.version}</span>`):`<span class="tag">Inte publicerat</span>`;
const tagFor=s=>`<span class="tag ${s==='Klart'||s==='Godkänt'?'good':s==='Saknas'||s==='Underkänt'?'red':'warn'}">${s}</span>`;

// ===== Översikt =====
function overviewPage(){
  if(isN1()){
    const waiting=[];
    Object.values(records).forEach(r=>{if(!r.published)waiting.push(['Inte publicerat',`${r.name} hos ${OPS[r.op].name}`,'Har aldrig publicerats och syns inte för spelare.','tables',r.id]);else if(draft(r))waiting.push(['Utkast',`${r.name} hos ${OPS[r.op].name}`,'Sparat utkast som inte är publicerat.','tables',r.id]);});
    Object.keys(OPS).forEach(op=>{if(pkgDirty(op))waiting.push(['Tilldelning',OPS[op].name,'Tilldelningen är ändrad men inte publicerad.','operators',null,op]);if(invites[op].length)waiting.push(['Team',OPS[op].name,`${invites[op].length} inbjudan har inte accepterats.`,'operators',null,op]);});
    if(!approved.viktor)waiting.push(['Godkännande','Viktor','Dealern är inte godkänd och kan inte tilldelas.','dealers',null,null,'viktor']);
    waiting.push(['Granskning','Tal för PAOW','Talpar väntar på godkännande.','dealers',null,null,'paow']);
    return levelPill()+header('Översikt','Det som väntar på Scout just nu. Allt här leder till platsen där det åtgärdas.')+
    `<div class="grid"><section class="panel"><div class="pad"><h2>Väntar på dig</h2></div><div class="list">${waiting.map(([tag,t,s,page,tid,op,d])=>`<div><span class="tag ${tag==='Utkast'?'warn':tag==='Granskning'?'blue':''}">${tag}</span><div class="col" style="flex:1 1 220px;gap:2px"><strong>${esc(t)}</strong><span class="tiny muted">${s}</span></div><button class="btn small" data-go="${page}" ${tid?`data-open="${tid}"`:''} ${op?`data-op="${op}"`:''} ${d?`data-dealer="${d}"`:''}>Öppna</button></div>`).join('')}</div></section>
    <div class="col" style="gap:16px"><section class="panel pad col" style="gap:10px"><h2>Börja med</h2><button class="btn primary" data-go="dealers">Lägg till klipp</button><button class="btn" data-go="operators">Tilldela innehåll till en operatör</button><button class="btn" data-go="dealers">Ny dealer</button></section>
    <section class="panel pad col" style="gap:8px"><h2>Nivåerna</h2><p class="sm"><strong>Nivå 1, Scout:</strong> skapar och tilldelar.</p><p class="sm"><strong>Nivå 2, operatören:</strong> väljer inom tilldelningen.</p><p class="sm"><strong>Nivå 3, spelaren:</strong> ser bara publicerat.</p></section></div></div>`;
  }
  const rows=tablesOf('john').map(r=>`<div><strong style="flex:1 1 200px">${esc(r.name)}</strong><span>${status(r)}</span><button class="btn small" data-open="${r.id}">Öppna</button></div>`).join('');
  return levelPill()+header('Ert casino, på ett ställe','Det som väntar hos Johns Bet.')+
  `<div class="grid"><section class="panel"><div class="pad"><h2>Spelbord</h2></div><div class="list">${rows}</div></section>
  <div class="col" style="gap:16px">
    <section class="panel pad col" style="gap:10px"><h2>Från Scout</h2><p class="sm">Tilldelning version ${assign.john.version}: ${pkg('john').dealers.map(id=>dealer(id).name).join(', ')} är era dealers. ${pkg('john').allow.dealer?'Ni får välja dealer per spelbord.':'Dealern väljs av Scout.'}</p><button class="btn small" data-go="dealers">Se era dealers</button></section>
    ${can('team.read')?`<section class="panel pad col" style="gap:10px"><h2>Team</h2><p class="sm">${invites.john.length} inbjudan har inte accepterats.</p><button class="btn small" data-go="team">Visa team</button></section>`:''}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.op!==undefined){state.op=d.op;state.otab=d.go?'assign':state.otab;}
  if(d.dealer!==undefined){state.dealer=d.dealer;state.delChecked=false;}
  if(d.open!==undefined){state.page='tables';state.table=d.open;state.tab='look';state.review=false;return render();}
  if(d.go)return go(d.go);
  if(d.back!==undefined)return go('tables');
  if(d.filter){state.filter=d.filter;return render();}
  if(d.tab){state.tab=d.tab;state.review=false;return render();}
  if(d.otab){state.otab=d.otab;state.invite=false;return render();}
  if(d.dtab){state.dtab=d.dtab;state.delChecked=false;return render();}
  if(d.stab){state.stab=d.stab;return render();}
  if(d.dealer!==undefined)return render();
  if(d.set&&b.tagName==='BUTTON'){table().working[d.set]=d.value;state.review=false;return render();}
  if(d.assign){const w=pkgWork(state.op);const i=w[d.assign].indexOf(d.value);if(i>=0)w[d.assign].splice(i,1);else w[d.assign].push(d.value);return render();}
  if(d.tal){state.talpar[d.tal]=d.value;return render();}
  if(d.role){const m=team[curOp()].find(x=>x.id==d.role);m.role=m.role==='editor'?'viewer':m.role==='viewer'?(isN1()?'admin':'editor'):'editor';if(m.role==='admin'){team[curOp()].forEach(x=>{if(x.id!=m.id&&x.role==='admin')x.last=false;});}return toast(`${m.name} är nu ${ROLE_NAME[m.role].toLowerCase()}.`);}
  if(d.susp){const m=team[curOp()].find(x=>x.id==d.susp);m.status=m.status==='Aktiv'?'Avstängd':'Aktiv';return toast(`${m.name} är ${m.status.toLowerCase()}.`);}
  if(d.resend!==undefined)return toast('Inbjudan skickad igen.');
  if(d.revoke!==undefined){invites[curOp()].splice(+d.revoke,1);return toast('Inbjudan tillbakadragen.');}
  switch(d.act){
    case 'save':{const r=table();r.saved=clone(r.working);return toast('Utkast sparat.');}
    case 'review':state.review=true;return render();
    case 'cancel-review':state.review=false;return render();
    case 'publish':{const r=table();const ch=diff({working:r.saved,live:r.live}).join(', ')||'Första publiceringen';r.live=clone(r.saved);r.version++;r.published=true;r.history.unshift({v:r.version,text:ch,who:isN1()?'Scout Gaming':ROLE_NAME[state.role]});journal[r.op].unshift({t:'[datum]',text:`${isN1()?'Scout Gaming':ROLE_NAME[state.role]} publicerade ${r.name}, version ${r.version}.`});state.review=false;return toast(`Publicerat. Version ${r.version} gäller från nästa runda.`);}
    case 'publish-assign':{const a=assign[state.op];a.published=clone(a.working);a.version++;journal[state.op].unshift({t:'[datum]',text:`Scout Gaming publicerade tilldelning version ${a.version}.`});return toast(`Tilldelning version ${a.version} publicerad. ${OPS[state.op].name} ser den nu i sin portal.`);}
    case 'discard-assign':{const a=assign[state.op];a.working=clone(a.published);return render();}
    case 'new-table':{const p=pkg(state.op);if(!p.dealers.length)return toast('Tilldela och publicera en dealer först.');const n=Object.keys(records).length+1;const id='t'+n;records[id]=mkTable(id,state.op,`Nytt spelbord ${n}`,false,{dealer:p.dealers[0],tableAsset:p.tableAssets[0]||'Oak',background:p.backgrounds[0]||'Midnight',open:false});state.page='tables';state.table=id;state.tab='look';return render();}
    case 'approve':approved[state.dealer]=!approved[state.dealer];if(!approved[state.dealer]){Object.keys(OPS).forEach(op=>{const w=pkgWork(op);w.dealers=w.dealers.filter(x=>x!==state.dealer);});}return render();
    case 'del-check':state.delChecked=true;return render();
    case 'add-clips':state.material=!state.material;return render();
    case 'new-dealer':return alert('Ny dealer: namn, spel och språk. Därefter Skapa material, Lägg till klipp, Röst och tal, Godkänn, Tilldela. Inte implementerad i skissen.');
    case 'new-op':return alert('Nytt bolag: namn, slug, standardroller och en första administratör. Inte implementerad i skissen.');
    case 'new-key':return toast('Ny nyckel skapad. Den visas bara en gång. (Skiss)');
    case 'preview':return alert('Provvisning öppnar samma spelare som spelarna ser, med sparade val. Inte implementerad i skissen.');
    case 'preview-dealer':return alert(`Förhandsvisning av ${dealer(d.value).name}: vila, utdelning och repliker. Inte implementerad i skissen.`);
    case 'preview-portal':return alert('Öppnar operatörsportalen som en läsare hos bolaget ser den, med serverbegränsning och loggning. Ingen rollväxling. Byt till Nivå 2 överst för att se portalen i skissen.');
    case 'invite':state.invite=!state.invite;return render();
    case 'send-invite':{const em=$('#inv-email').value.trim()||'[e-postadress]';invites[curOp()].push({email:em,role:$('#inv-role').value,sent:'[datum]'});state.invite=false;journal[curOp()].unshift({t:'[datum]',text:`${isN1()?'Scout Gaming':ROLE_NAME[state.role]} bjöd in ${em}.`});return toast('Inbjudan skickad.');}
    case 'material':state.material=!state.material;return render();
    case 'send-material':state.material=false;journal.john.unshift({t:'[datum]',text:'Johns Bet begärde material från Scout.'});return toast('Skickat till Scout. Ni ser svaret i journalen.');
    case 'rotate':return toast('Begäran om rotation skickad till Scout.');
    case 'testsession':return alert('Startar en testsession med demokrediter via Scouts API. Inte implementerad i skissen.');
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='who'){const [lvl,role]=el.value.split('-');state.level=lvl;state.role=role||'admin';state.page='overview';state.table=null;state.review=false;state.material=false;Object.values(records).forEach(r=>r.working=clone(r.saved));return render();}
  if(el.dataset.allow){pkgWork(isN1()&&state.page==='operators'?state.op:table().op).allow[el.dataset.allow]=el.checked;return render();}
  if(el.dataset.set&&state.table){const r=table();r.working[el.dataset.set]=el.type==='checkbox'?el.checked:el.value;state.review=false;render();}
});
$('#reset').addEventListener('click',()=>{resetData();$('#who').value='n1';render();});
render();
</script>
</body>
</html>
