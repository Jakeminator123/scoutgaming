name: Streaming checks

on:
  push:
    branches: [jakemanator123-github-work]
  pull_request:
    branches: [jakemanator123-github-work]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m compileall -q workers handler.py
      - run: python -m unittest discover -s tests -v
      - run: npm --prefix gateway ci
      - run: npm --prefix gateway test
      - run: bash -n fetch/fetch-musetalk.sh

  gpu-image-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build prepared avatars and runtime without deploying
        run: docker build --tag astrid-gpu-worker:check .
