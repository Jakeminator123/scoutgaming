<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Live Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/roulette/roulette.css">
</head>
<body>
<main class="rl">
  <header class="rl-top">
    <a class="rl-back" href="/studio/">← Table Studio</a>
    <div class="rl-brand"><img src="/brand/scout-mark.svg" alt=""><span>scout/gaming</span></div>
    <div class="rl-table-name" id="tableName">Roulette · European</div>
  </header>
  <section class="rl-stage" aria-label="Roulette table">
    <div class="rl-room"></div>
    <div class="rl-table" id="table">
      <img class="rl-felt" src="/roulette/assets/table.png" alt="" draggable="false">
      <div class="rl-wheel" id="wheel"></div>
      <div class="rl-targets" id="targets"></div>
      <div class="rl-stacks" id="stacks" aria-hidden="true"></div>
    </div>
    <ol class="rl-history" id="history" aria-label="Last numbers"></ol>
    <div class="rl-result" id="result" hidden></div>
  </section>
  <section class="rl-dock" aria-label="Your bets">
    <div class="rl-status"><span id="status">Connecting…</span><span class="rl-timer" id="timer"></span></div>
    <div class="rl-bar"><i id="bar"></i></div>
    <div class="rl-chips" id="chips" role="radiogroup" aria-label="Chip"></div>
    <div class="rl-columns" id="columns"></div>
    <div class="rl-actions">
      <button type="button" id="undo">Undo</button>
      <button type="button" id="clear">Clear</button>
      <button type="button" id="repeat">Repeat</button>
      <button type="button" id="refill" hidden>+ $1,000 demo</button>
    </div>
    <div class="rl-wallet">
      <div><small>Balance</small><b id="balance">–</b></div>
      <div><small>Your bet</small><b id="staked">$0</b></div>
      <div><small>Players</small><b id="players">–</b></div>
    </div>
    <p class="rl-error" id="error" role="alert" hidden></p>
  </section>
</main>
<script type="module" src="/roulette/roulette.js"></script>
</body>
</html>
