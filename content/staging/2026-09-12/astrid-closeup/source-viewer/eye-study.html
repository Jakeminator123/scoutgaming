<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrid · eyes and blinking</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17191b;color:#eee;font:14px system-ui}header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #34373a}h1{font-size:22px;font-weight:500;margin:0}header span{font-size:12px;color:#b2b7bc}.grid{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - 195px);min-height:350px}figure{margin:0;position:relative;background:#303133;overflow:hidden}figure+figure{border-left:1px solid #45474a}figure img{width:100%;height:100%;object-fit:contain}figcaption{position:absolute;left:15px;top:15px;background:#17191bdd;padding:7px 12px;border-radius:5px;font-size:12px}canvas{display:block;width:100%;height:100%;touch-action:none}footer{padding:14px 24px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}label{display:flex;align-items:center;gap:7px;font-size:12px;color:#ccc}input{width:110px;accent-color:#b5c8bc}button{background:#34383b;color:#eee;border:1px solid #596065;padding:9px 13px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#456051}.notes{width:100%;font-size:12px;color:#aaa;display:flex;justify-content:space-between;gap:10px}a{color:#ccd9d1}#status{position:absolute;bottom:20px;left:18px;background:#17191bdd;padding:8px 12px}@media(max-width:650px){header{padding:12px}header span{max-width:145px}.grid{height:60dvh}footer{padding:12px;gap:10px}.notes{flex-wrap:wrap}input{width:80px}}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<header><h1>Astrid</h1><span>Eye movement study · Face and hair still in progress</span></header>
<main class="grid"><figure><img src="reference.png" alt="Astrid portrait reference"><figcaption>Reference</figcaption></figure><figure id="stage"><canvas id="model" aria-label="Astrid with controllable gaze and blinking"></canvas><figcaption>Actual 3D model</figcaption><div id="status" role="status">Loading eye rig…</div></figure></main>
<footer><button id="front">Reset</button><button id="play" aria-pressed="false">Play eye movement</button><label>Blink <input id="blink" type="range" min="0" max="1" step=".01" value="0"></label><label>Look left / right <input id="yaw" type="range" min="-10" max="10" step=".1" value="0"></label><label>Look up / down <input id="pitch" type="range" min="-6" max="6" step=".1" value="0"></label><div class="notes"><span>Drag to turn the head · Eyes and eyelids are separate editable geometry.</span><span><a href="eye-rig.blend" download>Blender project</a> · <a href="eye-rig.glb" download>GLB with materials</a> · <a href="./">Original comparison</a></span></div></footer>
<script type="module" src="eyes.mjs"></script></html>
