<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout Backoffice — Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0A0B0D;color:#F2F1ED;font:14px/1.5 Inter,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:360px;background:#101214;border:1px solid rgba(242,241,237,.08);border-radius:14px;padding:34px 30px}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.logo b{font-family:'Space Grotesk';font-weight:700;font-size:18px}
.logo b i{color:#D6FF3A;font-style:normal}
.tag{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.22em;color:#9a9aa2;margin-bottom:26px}
label{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.16em;color:#9a9aa2;display:block;margin:14px 0 6px}
input{width:100%;background:#15181B;border:1px solid rgba(242,241,237,.12);border-radius:8px;color:#F2F1ED;padding:11px 13px;font:14px Inter,sans-serif}
input:focus{outline:none;border-color:#D6FF3A}
button{width:100%;margin-top:22px;background:#D6FF3A;color:#0A0B0D;border:none;border-radius:99px;padding:12px;font-family:'JetBrains Mono';font-size:11px;letter-spacing:.14em;font-weight:700;cursor:pointer}
button:hover{background:#e2ff66}
.err{color:#E86A5E;font-size:12px;margin-top:12px;min-height:16px}
.foot{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.14em;color:#9a9aa2;margin-top:22px;text-align:center}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="logo"><svg width="26" height="26" viewBox="0 0 100 100"><path d="M8 22 V8 H22" fill="none" stroke="#F2F1ED" stroke-width="8"/><path d="M78 8 H92 V22" fill="none" stroke="#F2F1ED" stroke-width="8"/><path d="M92 78 V92 H78" fill="none" stroke="#F2F1ED" stroke-width="8"/><path d="M22 92 H8 V78" fill="none" stroke="#F2F1ED" stroke-width="8"/><path d="M68 36 C68 28, 60 24, 50 24 C40 24, 32 28, 32 36 C32 50, 68 50, 68 64 C68 72, 60 76, 50 76 C40 76, 32 72, 32 64" fill="none" stroke="#F2F1ED" stroke-width="9.5"/><circle cx="50" cy="50" r="7" fill="#D6FF3A"/></svg><b>scout<i>/</i>gaming</b></div>
  <div class="tag">LIVE CASINO BACKOFFICE</div>
  <label for="u">USERNAME</label>
  <input id="u" autocomplete="username" required>
  <label for="p">PASSWORD</label>
  <input id="p" type="password" autocomplete="current-password" required>
  <button type="submit">SIGN IN</button>
  <div class="err" id="err"></div>
  <div class="foot"><a href="#" id="forgot" style="color:#9a9aa2;text-decoration:underline">FORGOT PASSWORD?</a> &middot; AUTHORIZED PERSONNEL ONLY</div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/bo/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ user: document.getElementById('u').value, pass: document.getElementById('p').value }) });
  if (r.ok) {
    const next=new URLSearchParams(location.search).get('returnTo');
    location.href = next === '/studio/administration' || /^\/api\/bo\/(?:game-login|lab-login)\?state=[a-f0-9]{64}$/.test(next??'') ? next : '/bo/';
  }
  else document.getElementById('err').textContent = 'Wrong username or password.';
};
document.getElementById('forgot').onclick = async e => {
  e.preventDefault();
  const u = document.getElementById('u').value;
  const err = document.getElementById('err');
  if (!u) { err.textContent = 'Enter your username or email above first.'; return; }
  await fetch('/api/bo/reset-request', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: u }) });
  err.style.color = '#D6FF3A';
  err.textContent = 'If that account exists and has an email, a reset link is on its way.';
};
</script>
</body>
</html>
