<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Croupier — Privé Blackjack</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="scene">
    <div id="room"></div>
    <div id="room2"></div>
    <div id="dealer-wrap"><canvas id="dealer"></canvas></div>

    <header id="hud-top">
      <div id="game-title">
        <h1>Privé Blackjack <span class="limits">· $5 – $2,000</span></h1>
        <div class="sub">Croupier Demo · <span id="clock"></span> · <span class="ai-badge" title="This dealer is an AI. Outcomes are determined by a certified RNG.">AI dealer</span></div>
      </div>
      <div id="top-right">
        <button id="sound-btn" title="dealer voice">🔊</button>
        <div id="chat">
          <input id="chat-input" placeholder="Ask anything…" autocomplete="off" />
          <button id="chat-send" aria-label="send">➤</button>
        </div>
      </div>
    </header>

    <div id="banner">PLEASE PLACE BETS</div>
    <div id="caption"></div>

    <!-- the whole table: screen-space perspective art matched to the ER -->
    <div id="table2d">
      <svg id="tableart" viewBox="0 0 1600 560" preserveAspectRatio="none">
        <defs>
          <radialGradient id="feltg" cx="50%" cy="12%" r="95%">
            <stop offset="0%" stop-color="#3ba263"/>
            <stop offset="45%" stop-color="#2a8a52"/>
            <stop offset="100%" stop-color="#1b6238"/>
          </radialGradient>
          <linearGradient id="railg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#26272e"/>
            <stop offset="18%" stop-color="#17181d"/>
            <stop offset="100%" stop-color="#0c0d10"/>
          </linearGradient>
          <path id="t-arc-big" d="M 470 218 Q 800 172 1130 218" fill="none"/>
          <path id="t-arc-small" d="M 540 248 Q 800 210 1060 248" fill="none"/>
          <path id="t-ins-top" d="M 490 305 Q 800 260 1110 305" fill="none"/>
          <path id="t-ins-mid" d="M 480 330 Q 800 285 1120 330" fill="none"/>
          <path id="t-ins-bot" d="M 490 352 Q 800 308 1110 352" fill="none"/>
        </defs>
        <path d="M -20 300 Q 40 100 300 74 L 640 74 A 170 46 0 0 0 960 74 L 1300 74 Q 1560 100 1620 300 L 1620 580 -20 580 Z" fill="url(#railg)"/>
        <path d="M -14 340 Q 60 132 320 104 L 655 104 A 158 38 0 0 0 945 104 L 1280 104 Q 1540 132 1614 340 L 1614 580 -14 580 Z" fill="url(#feltg)"/>
        <path d="M 30 560 Q 120 200 380 168 L 680 168 A 136 30 0 0 0 920 168 L 1220 168 Q 1480 200 1570 560" fill="none" stroke="rgba(233,214,138,.42)" stroke-width="2.5"/>
        <text class="t-line big"><textPath href="#t-arc-big" startOffset="50%" text-anchor="middle">BLACKJACK PAYS 3 TO 2</textPath></text>
        <text class="t-line small"><textPath href="#t-arc-small" startOffset="50%" text-anchor="middle">Dealer must draw to 16 and stand on all 17s</textPath></text>
        <use href="#t-ins-top" class="t-ins-line"/>
        <use href="#t-ins-bot" class="t-ins-line"/>
        <text class="t-line ins"><textPath href="#t-ins-mid" startOffset="50%" text-anchor="middle">INSURANCE PAYS 2 TO 1</textPath></text>
      </svg>
      <div id="discard"><img src="assets/tray.png" alt=""></div>
      <div id="shoe2d"><img src="assets/shoe.png" alt=""></div>
      <div id="dealer-cards" class="cards"></div>
      <div id="seats"></div>
    </div>

    <div id="actions-top"<div id="actions-top" hidden>
      <button data-act="double"><i>2x</i><em>DOUBLE</em></button>
      <button data-act="hit"><i>+</i><em>HIT</em></button>
      <button data-act="stand"><i>&minus;</i><em>STAND</em></button>
      <button data-act="split" disabled><i>&harr;</i><em>SPLIT</em></button>
    </div>
    <button id="ask-pill" type="button">&#10024; Unsure? <b>Ask Vera</b></button>
    <div id="actions" hidden>
      <button data-act="double" title="double">2×</button>
      <button data-act="hit" title="hit">+</button>
      <button data-act="stand" title="stand">−</button>
      <button data-act="split" title="split (coming soon)" disabled>↔</button>
    </div>
    <div id="insurance" hidden>
      <span>Insurance?</span>
      <button id="ins-yes">YES</button>
      <button id="ins-no">NO</button>
    </div>

    <div id="chip-row">
      <button id="undo-btn" title="undo last chip" disabled>⟲</button>
      <div id="chips"></div>
      <button id="double-btn" title="double all bets" disabled>2×</button>
    </div>
    <button id="deal-now" disabled>DEAL NOW</button>

    <footer id="hud-bottom">
      <div id="wallet">
        <div><label>BALANCE</label><span id="balance">$1,000.00</span></div>
        <div><label>TOTAL BET</label><span id="total-bet">$0.00</span></div>
      </div>
      <div id="deal-controls">
        <button id="clear-btn" disabled>CLEAR</button>
      </div>
      <button id="autobet" disabled title="Autobet is opt-in only and not in this demo">⟳ AUTOBET</button>
    </footer>

    <div id="engine-hud"></div>
  </div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
