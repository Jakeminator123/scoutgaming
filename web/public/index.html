<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Croupier — Privé Blackjack</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="scene">
    <div id="room"></div>
    <div id="room2"></div>
    <div id="dealer-wrap"><canvas id="dealer"></canvas></div>

    <header id="hud-top">
      <div id="game-title">
        <h1>Privé Blackjack <span class="limits">· $5 – $2,000</span></h1>
        <div class="sub">Croupier Demo · <span id="clock"></span> · <span class="ai-badge" title="This dealer is an AI. Outcomes are determined by a certified RNG.">AI dealer</span></div>
      </div>
      <div id="top-right">
        <button id="sound-btn" title="dealer voice">🔊</button>
        <div id="chat">
          <input id="chat-input" placeholder="Ask anything…" autocomplete="off" />
          <button id="chat-send" aria-label="send">➤</button>
        </div>
      </div>
    </header>

    <div id="banner">PLEASE PLACE BETS</div>
    <div id="caption"></div>

    <!-- the whole table: a 3D perspective plane -->
    <div id="table3d">
      <div id="plane">
        <div id="oval">
          <svg id="felt-arcs" viewBox="0 0 1000 620" preserveAspectRatio="none">
            <defs>
              <path id="arc-outer" d="M 300 148 A 520 300 0 0 1 700 148" fill="none" />
              <path id="arc-mid" d="M 320 176 A 520 300 0 0 1 680 176" fill="none" />
              <path id="arc-ins-t" d="M 322 212 A 560 330 0 0 1 678 212" fill="none" />
              <path id="arc-ins" d="M 285 240 A 640 380 0 0 1 715 240" fill="none" />
              <path id="arc-ins-b" d="M 322 262 A 560 330 0 0 1 678 262" fill="none" />
            </defs>
            <text class="felt-line big"><textPath href="#arc-outer" startOffset="50%" text-anchor="middle">BLACKJACK PAYS 3 TO 2</textPath></text>
            <text class="felt-line small"><textPath href="#arc-mid" startOffset="50%" text-anchor="middle">Dealer must draw to 16 and stand on all 17s</textPath></text>
            <use href="#arc-ins-t" class="ins-line" />
            <use href="#arc-ins-b" class="ins-line" />
            <text class="felt-line ins"><textPath href="#arc-ins" startOffset="50%" text-anchor="middle">INSURANCE PAYS 2 TO 1</textPath></text>
          </svg>
          <div id="discard"></div><div id="shoe3d"><div class="s-body"></div><div class="s-top"></div><div class="s-card"></div><div class="s-lip"></div></div>
          <div id="dealer-cards-anchor"><div id="dealer-cards" class="cards"></div></div>
          <div id="seats"></div>
        </div>
      </div>
    </div>

    <div id="actions-top" hidden>
      <button data-act="double">DOUBLE</button>
      <button data-act="hit">HIT</button>
      <button data-act="stand">STAND</button>
      <button data-act="split" disabled>SPLIT</button>
    </div>
    <div id="actions" hidden>
      <button data-act="double" title="double">2×</button>
      <button data-act="hit" title="hit">+</button>
      <button data-act="stand" title="stand">−</button>
    </div>
    <div id="insurance" hidden>
      <span>Insurance?</span>
      <button id="ins-yes">YES</button>
      <button id="ins-no">NO</button>
    </div>

    <div id="chip-row">
      <button id="undo-btn" title="undo last chip" disabled>⟲</button>
      <div id="chips"></div>
      <button id="double-btn" title="double all bets" disabled>2×</button>
    </div>
    <button id="deal-now" disabled>DEAL NOW</button>

    <footer id="hud-bottom">
      <div id="wallet">
        <div><label>BALANCE</label><span id="balance">$1,000.00</span></div>
        <div><label>TOTAL BET</label><span id="total-bet">$0.00</span></div>
      </div>
      <div id="deal-controls">
        <button id="clear-btn" disabled>CLEAR</button>
      </div>
      <button id="autobet" disabled title="Autobet is opt-in only and not in this demo">⟳ AUTOBET</button>
    </footer>

    <div id="engine-hud"></div>
  </div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
