<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astrid · Green-screen test 01</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111513;color:#edf2ee;font:16px/1.5 system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:18px}h1{font-size:25px;margin:0}p{color:#bcc5bf;margin:8px 0 24px}.status{color:#ffd49a;border:1px solid #665133;border-radius:30px;padding:7px 14px;font-size:13px;white-space:nowrap}video{display:block;width:100%;background:#000;border-radius:12px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}button,a,select{background:#263a2d;color:#e6f7eb;border:1px solid #526354;border-radius:6px;padding:9px 14px;font:inherit;text-decoration:none}button,select{cursor:pointer}label{display:flex;align-items:center;gap:8px}small{display:block;color:#98a69c;margin-top:22px}@media(max-width:700px){header{display:block}.status{display:inline-block;margin:12px 0}main{padding:20px 12px}}
</style>
<main>
<header><h1>Astrid · Green-screen test 01</h1><span class="status">Motion needs correction</span></header>
<p>The card moves without a proper handoff. This first test has not been added to the game.</p>
<video id="clip" controls autoplay muted loop playsinline src="source.mp4"></video>
<div class="controls"><button id="replay">Replay</button><label>Speed <select id="speed"><option value="1">Normal</option><option value="0.5">Half speed</option></select></label><label><input id="repeat" type="checkbox" checked> Repeat</label><a href="source.mp4" download="astrid-green-test-01.mp4">Download clip</a></div>
<small>Based on your selected a9fa1da6 · Kling 3.0 · 3 seconds · 16:9 · Green card with corner markers</small>
</main>
<script type="module">
const video=document.querySelector('#clip');
document.querySelector('#replay').addEventListener('click',()=>{video.currentTime=0;video.play()});
document.querySelector('#speed').addEventListener('change',event=>{video.playbackRate=Number(event.target.value)});
document.querySelector('#repeat').addEventListener('change',event=>{video.loop=event.target.checked});
</script>
</html>
