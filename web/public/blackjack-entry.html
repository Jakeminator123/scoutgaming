<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blackjack · Astrid</title>
  <link rel="stylesheet" href="/blackjack-entry.css">
  <script type="module" src="/blackjack-entry.mjs"></script>
</head>
<body><main>
  <p class="eyebrow">ASTRID · BLACKJACK</p>
  <h1>Välkommen till bordet.</h1>
  <p>Logga in med ditt Croupier-konto för att spela med Astrid. Vi använder demokrediter.</p>
  <p>Konton och lösenord hanteras av en administratör i Backoffice.</p><p id="login-help"></p>
  <p id="status" role="status">Kontrollerar inloggning…</p>
  <form hidden>
    <label for="username">Användarnamn eller e-post</label>
    <input id="username" name="username" autocomplete="username" maxlength="254" required>
    <label for="password">Lösenord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <button id="submit" type="submit" disabled>Logga in</button>
  </form><p id="legacy-admin" hidden>Administratör? <a href="/studio/login">Logga in i Studio</a>.</p>
</main></body></html>
